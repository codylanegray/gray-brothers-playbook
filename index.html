<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gray Brothers Playbook</title>
<meta name="description" content="A self-paced, interactive AI course for Kyle, Cole and Cody Gray.">
<meta name="theme-color" content="#F3EEE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231D1B17'/%3E%3Cpath d='M14 18l12 12M26 18L14 30' stroke='%23F07A3E' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='42' r='8' fill='none' stroke='%23EFE8DA' stroke-width='5'/%3E%3Cpath d='M28 36c6 0 8-4 10-8' stroke='%23EFE8DA' stroke-width='3' stroke-dasharray='3 4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME TOKENS
   ========================================================= */
:root{
  --bg:#F3EEE4; --bg2:#EAE2D2; --card:#FFFDF8; --card2:#F8F3E9;
  --ink:#1D1B17; --ink2:#4B463D; --ink3:#6E675A; --line:#D9CFBC; --line2:#C9BDA6;
  --accent:#B9461A; --accent-bg:#E8662B; --accent-soft:#F8DCCB; --on-accent:#FFFFFF;
  --steel:#2C587A; --steel-soft:#D7E4EE;
  --green:#2D6A39; --green-soft:#D8EBD9;
  --red:#A8251B; --red-soft:#F6D9D5;
  --gold:#946A0E; --gold-soft:#F4E6C2;
  --kyle:#2C587A; --cole:#2D6A39; --cody:#B9461A; --guest:#6B6558;
  --shadow:0 1px 0 rgba(29,27,23,.06), 0 6px 18px -8px rgba(29,27,23,.25);
  --shadow-lg:0 2px 0 rgba(29,27,23,.06), 0 18px 40px -16px rgba(29,27,23,.35);
  --radius:14px; --radius-sm:9px;
  --grid:rgba(29,27,23,.045);
  --font-head:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14130F; --bg2:#1B1914; --card:#211F1A; --card2:#28251F;
    --ink:#F0E9DB; --ink2:#C5BCA9; --ink3:#9C9381; --line:#3A362D; --line2:#4A4539;
    --accent:#F3884F; --accent-bg:#E8662B; --accent-soft:#3D2418; --on-accent:#1A0F08;
    --steel:#86B6DA; --steel-soft:#1C2A35; --green:#86C994; --green-soft:#1B2C1E;
    --red:#F08A80; --red-soft:#3A1C19; --gold:#E2B95A; --gold-soft:#33291A;
    --kyle:#86B6DA; --cole:#86C994; --cody:#F3884F; --guest:#B5AC9A;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
    --shadow-lg:0 2px 0 rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.8);
    --grid:rgba(240,233,219,.035);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14130F; --bg2:#1B1914; --card:#211F1A; --card2:#28251F;
  --ink:#F0E9DB; --ink2:#C5BCA9; --ink3:#9C9381; --line:#3A362D; --line2:#4A4539;
  --accent:#F3884F; --accent-bg:#E8662B; --accent-soft:#3D2418; --on-accent:#1A0F08;
  --steel:#86B6DA; --steel-soft:#1C2A35; --green:#86C994; --green-soft:#1B2C1E;
  --red:#F08A80; --red-soft:#3A1C19; --gold:#E2B95A; --gold-soft:#33291A;
  --kyle:#86B6DA; --cole:#86C994; --cody:#F3884F; --guest:#B5AC9A;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.7);
  --shadow-lg:0 2px 0 rgba(0,0,0,.4), 0 20px 44px -18px rgba(0,0,0,.8);
  --grid:rgba(240,233,219,.035);
  color-scheme:dark;
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.08;margin:0 0 .5em;letter-spacing:.005em}
h1{font-size:clamp(2.3rem,7vw,3.6rem);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(1.65rem,4.5vw,2.2rem);font-weight:800;text-transform:uppercase;margin-top:1.6em}
h3{font-size:1.4rem;font-weight:700}
h4{font-size:1.15rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 1em}
a{color:var(--accent);text-underline-offset:3px}
ul,ol{padding-left:1.25em;margin:0 0 1em}
li{margin:.25em 0}
strong{font-weight:700}
code,kbd{font-family:var(--font-mono);font-size:.88em;background:var(--bg2);padding:.1em .35em;border-radius:5px}
hr{border:0;border-top:2px dashed var(--line);margin:2em 0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}

/* =========================================================
   TOP BAR + LAYOUT
   ========================================================= */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:2px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0;flex:1}
.brand svg{flex:none}
.brand-txt{font-family:var(--font-head);font-weight:800;text-transform:uppercase;line-height:.95;font-size:1.15rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:.72rem;letter-spacing:.18em;color:var(--ink3);font-weight:700}
.iconbtn{
  display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line2);
  background:var(--card);cursor:pointer;color:var(--ink);padding:0 10px;gap:6px;
}
.iconbtn:hover{border-color:var(--ink)}
.profile-chip{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:1.05rem;
  color:#fff;background:var(--pc,var(--guest));flex:none;
}
[data-theme="dark"] .avatar, .avatar.dk{color:#14130F}
.chip-lvl{font-size:.75rem;color:var(--ink3);font-weight:600;display:block;line-height:1}
.xpmini{height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;width:54px;margin-top:3px}
.xpmini i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:4px;transition:width .6s ease}
@media (max-width:520px){.chip-meta{display:none}}

.layout{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto}
.sidenav{display:none}
main:focus{outline:none}
main{padding:22px 16px 90px;min-width:0;max-width:820px;width:100%;margin:0 auto}
@media (min-width:1000px){
  .layout{grid-template-columns:270px 1fr}
  .sidenav{display:block;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto;padding:22px 10px 40px 16px;border-right:2px dashed var(--line)}
  #menuBtn{display:none}
  main{padding:30px 34px 100px}
}
.nav-group{margin-bottom:18px}
.nav-label{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;color:var(--ink3);font-weight:700;margin:0 10px 6px}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.97rem;
  min-height:42px;
}
.nav-link:hover{background:var(--bg2)}
.nav-link[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav-link .st{margin-left:auto;font-size:.8rem;opacity:.8}
.nav-num{font-family:var(--font-head);font-weight:800;width:24px;text-align:center;opacity:.65}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(10,9,7,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:var(--bg);z-index:61;transform:translateX(-102%);transition:transform .25s ease;overflow:auto;padding:16px 10px 40px;border-right:2px solid var(--ink);padding-top:max(16px,env(safe-area-inset-top))}
.drawer-open .drawer{transform:none}
.drawer-open .drawer-bg{opacity:1;pointer-events:auto}

/* =========================================================
   COMPONENTS
   ========================================================= */
.eyebrow{font-family:var(--font-head);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:.85rem;color:var(--accent);margin-bottom:.4em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .pill{letter-spacing:.06em}
.lede{font-size:1.15rem;color:var(--ink2)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.ink .muted{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.muted{color:var(--ink3)}
.small{font-size:.9rem}
.grid{display:grid;gap:14px}
@media (min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap;font-family:var(--font-body);text-transform:none}
.pill.free{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.paid{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.k{background:var(--steel-soft);color:var(--kyle);border-color:transparent}
.pill.c{background:var(--green-soft);color:var(--cole);border-color:transparent}
.pill.d{background:var(--accent-soft);color:var(--cody);border-color:transparent}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;
  font-weight:700;font-size:1rem;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;
  transition:transform .12s ease, box-shadow .12s ease, background .15s;box-shadow:0 3px 0 var(--ink);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent-bg);color:#fff;border-color:var(--ink)}
[data-theme="dark"] .btn.primary{color:#170C05}
.btn.ghost{box-shadow:none;border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.92rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.block{width:100%}

.callout{border-left:6px solid var(--accent-bg);background:var(--card);padding:14px 16px;border-radius:0 12px 12px 0;margin:1.2em 0;box-shadow:var(--shadow)}
.callout.tip{border-color:var(--steel)}
.callout.warn{border-color:var(--red)}
.callout.win{border-color:var(--green)}
.callout .ct{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;margin-bottom:4px;display:block}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}

.progress{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.progress i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pc,var(--accent-bg)) 0 10px,color-mix(in srgb,var(--pc,var(--accent-bg)) 82%,#fff) 10px 20px);transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* section rhythm */
.sec{margin:1.6em 0}
.sec-h{display:flex;align-items:baseline;gap:10px}
.mod-head{padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:18px}
.mod-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:1em 0}
.flip{perspective:1000px;min-height:170px;border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
.flip-in{display:block;position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);padding:16px;border:2px solid var(--ink);display:flex;flex-direction:column}
.flip-f{background:var(--card);box-shadow:0 4px 0 var(--ink)}
.flip-f b{font-family:var(--font-head);font-size:1.45rem;text-transform:uppercase;line-height:1.05;font-weight:800}
.flip-f .hint{margin-top:auto;font-size:.8rem;color:var(--ink3);font-weight:600}
.flip-b{background:var(--ink);color:var(--bg);transform:rotateY(180deg);font-size:.95rem;line-height:1.45;overflow:auto}
@media (prefers-reduced-motion: reduce){.flip.on .flip-in{transform:none}.flip.on .flip-f{visibility:hidden}.flip-b{transform:none;visibility:hidden}.flip.on .flip-b{visibility:visible}}

/* expandables */
details.ex{background:var(--card);border:2px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
details.ex[open]{border-color:var(--ink2)}
details.ex summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center;min-height:52px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"+";margin-left:auto;font-family:var(--font-head);font-size:1.6rem;line-height:1;transition:transform .2s}
details.ex[open] summary::after{transform:rotate(45deg)}
details.ex .ex-b{padding:0 16px 14px;animation:fadeUp .25s ease}
details.ex .ex-n{font-family:var(--font-head);font-weight:800;color:var(--accent);min-width:1.6em}

/* checklist */
.checks{list-style:none;padding:0;margin:1em 0}
.checks li{margin:8px 0}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.chk:hover{border-color:var(--ink2)}
.chk .box{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;margin-top:1px;transition:background .15s}
.chk[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green)}
.chk[aria-pressed="true"] .box{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"] .box::after{content:"";width:7px;height:13px;border:solid var(--card);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .xp{margin-left:auto;font-size:.78rem;font-weight:800;color:var(--accent);white-space:nowrap}

/* quiz */
.quiz{border:3px solid var(--ink);border-radius:var(--radius);background:var(--card);padding:18px;margin:2em 0;box-shadow:0 5px 0 var(--ink)}
.quiz h2{margin-top:0}
.qq{padding:14px 0;border-top:2px dashed var(--line)}
.qq:first-of-type{border-top:0}
.qq .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:12px 14px;margin:7px 0;border:2px solid var(--line2);border-radius:11px;background:var(--card2);cursor:pointer;min-height:50px;align-items:flex-start;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .ol{font-family:var(--font-head);font-weight:800;width:22px;flex:none}
.opt[disabled]{cursor:default}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.fb{padding:10px 14px;border-radius:10px;margin-top:6px;font-size:.95rem;animation:fadeUp .25s ease}
.fb.ok{background:var(--green-soft);color:var(--ink)}
.fb.no{background:var(--red-soft);color:var(--ink)}
.fb b{display:block;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.06em}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:12px;background:var(--bg2);margin-top:12px}
.score .big{font-family:var(--font-head);font-weight:800;font-size:2.6rem;line-height:1}

/* fork (choose your path) */
.fork{border:2px dashed var(--ink2);border-radius:var(--radius);padding:16px;margin:1.6em 0;background:color-mix(in srgb,var(--card) 70%,transparent)}
.fork-q{font-family:var(--font-head);font-weight:800;text-transform:uppercase;font-size:1.3rem;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.fork-opts{display:grid;gap:10px}
@media (min-width:640px){.fork-opts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.fork-opt{border:2px solid var(--line2);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-weight:700;min-height:56px}
.fork-opt small{display:block;font-weight:500;color:var(--ink3)}
.fork-opt[aria-pressed="true"]{border-color:var(--accent-bg);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-bg)}
.fork-out{margin-top:14px;animation:fadeUp .3s ease}

/* compare before / after */
.cmp{display:grid;gap:12px;margin:1.2em 0}
@media (min-width:700px){.cmp{grid-template-columns:1fr 1fr}}
.cmp > div{border-radius:12px;padding:14px;border:2px solid}
.cmp .bad{border-color:var(--red);background:var(--red-soft)}
.cmp .good{border-color:var(--green);background:var(--green-soft)}
.cmp h4{margin-bottom:6px}
.cmp pre{white-space:pre-wrap;font-family:var(--font-body);font-size:.95rem;margin:0;line-height:1.5}
.cmp-why{grid-column:1/-1;font-size:.95rem;color:var(--ink2)}

/* glossary term */
.gl{font:inherit;background:none;border:0;padding:0;color:inherit;border-bottom:2px dotted var(--accent);cursor:help;font-weight:600}
.gl:hover,.gl:focus-visible{color:var(--accent)}
#glossPop{position:absolute;z-index:80;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:.93rem;line-height:1.45;box-shadow:var(--shadow-lg);display:none}
#glossPop b{display:block;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-bg);margin-bottom:2px}
#glossPop.on{display:block;animation:fadeUp .15s ease}

/* toasts */
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3);width:100%}
.toast .tx{font-family:var(--font-head);font-size:1.35rem;color:var(--accent-bg);font-weight:800}
.toast.badge{background:var(--accent-bg);color:#fff}
.toast.badge .tx{color:#fff}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-enter{animation:fadeUp .35s ease}

/* profile picker */
.hero{position:relative;padding:10px 0 4px}
.hero h1{font-size:clamp(2.7rem,11vw,5.2rem);line-height:.9;margin-bottom:.25em}
.hero h1 em{font-style:normal;color:var(--accent);display:block}
.play-svg{width:100%;max-width:520px;height:auto;display:block;margin:6px 0 10px;color:var(--ink)}
.play-svg .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s ease forwards .3s}
@keyframes draw{to{stroke-dashoffset:0}}
.pick-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:18px 0}
@media (min-width:720px){.pick-grid{grid-template-columns:repeat(4,1fr)}}
.pick{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:16px 14px;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .12s, box-shadow .12s;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.pick:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.pick:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.pick::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--pc)}
.pick .nm{font-family:var(--font-head);font-weight:800;font-size:2rem;text-transform:uppercase;line-height:1;margin-top:8px}
.pick .rl{font-size:.88rem;color:var(--ink3);font-weight:600;line-height:1.3;margin-top:4px}
.pick .lv{margin-top:auto;padding-top:10px;font-size:.8rem;font-weight:700;color:var(--pc)}

/* reveal */
.reveal{background:var(--ink);color:var(--bg);border-radius:18px;padding:22px 18px;position:relative;overflow:hidden;margin:18px 0}
.reveal h2{margin-top:0;color:var(--bg)}
.reveal .term{font-family:var(--font-mono);font-size:.88rem;background:#000;color:#E9E2D2;border-radius:10px;padding:14px;line-height:1.55;overflow:auto;border:1px solid #3a362d;min-height:170px}
.reveal .term .p{color:#F3884F}
.reveal .term .ok{color:#86C994}
.cursor{display:inline-block;width:8px;height:1em;background:#E9E2D2;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid #4A4539;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-head);font-size:1.8rem;line-height:1;color:#F3884F}
.stat span{font-size:.78rem;color:#B5AC9A}

/* assessment */
.aq{margin:16px 0}
.aq .qt{font-weight:700;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* dashboard */
.lvl-card{display:grid;gap:14px;grid-template-columns:auto 1fr;align-items:center}
.lvl-badge{width:78px;height:78px;border-radius:18px;background:var(--pc);display:grid;place-items:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:2.4rem;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
[data-theme="dark"] .lvl-badge{color:#14130F}
.lvl-name{font-family:var(--font-head);font-weight:800;text-transform:uppercase;font-size:1.6rem;line-height:1}
.mod-list{display:grid;gap:10px}
.mod-item{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:var(--ink);min-height:64px;transition:border-color .15s, transform .15s}
.mod-item:hover{border-color:var(--ink);transform:translateX(2px)}
.mod-n{font-family:var(--font-head);font-weight:800;font-size:1.8rem;width:38px;text-align:center;color:var(--ink3)}
.mod-item.done .mod-n{color:var(--green)}
.mod-t{font-weight:700;line-height:1.25}
.mod-t small{display:block;font-weight:500;color:var(--ink3)}
.mod-s{margin-left:auto;flex:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;background:var(--card);opacity:.55}
.bdg.on{opacity:1;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.bdg .ic{font-size:1.8rem;line-height:1;filter:grayscale(1)}
.bdg.on .ic{filter:none}
.bdg b{display:block;font-family:var(--font-head);text-transform:uppercase;font-size:1rem;line-height:1.05;margin-top:6px}
.bdg span{font-size:.75rem;color:var(--ink3);line-height:1.25;display:block;margin-top:3px}
.tool-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.tool-tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:2px solid var(--ink);border-radius:14px;padding:14px;background:var(--card);text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile:hover{transform:translateY(-1px)}
.tile b{font-family:var(--font-head);text-transform:uppercase;font-size:1.15rem;line-height:1.05}
.tile span{font-size:.85rem;color:var(--ink3);line-height:1.3}

/* landscape */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fchip{border:2px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:40px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);min-height:50px}
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.tcard{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:6px;animation:fadeUp .25s ease}
.tcard h3{margin:0;font-size:1.35rem;text-transform:uppercase}
.tcard .mk{font-size:.8rem;color:var(--ink3);font-weight:600;margin-top:-4px}
.tcard .best{font-weight:600;line-height:1.35}
.tcard ul{font-size:.9rem;margin:0;padding-left:1.1em}
.tcard .pk{font-size:.88rem;background:var(--bg2);border-radius:9px;padding:8px 10px;margin-top:auto}
.tcard .pk b{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.06em}
.cat-tag{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:var(--accent);font-weight:800}

/* mockups */
.mock{border:2px solid var(--ink);border-radius:14px;background:var(--card2);overflow:hidden;margin:1em 0;box-shadow:var(--shadow);font-size:.9rem}
.mock-bar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:2px solid var(--line)}
.mock-bar i{width:10px;height:10px;border-radius:50%;background:var(--line2);display:block}
.mock-bar span{margin-left:8px;font-size:.78rem;color:var(--ink3);font-weight:700;letter-spacing:.04em}
.mock-body{padding:12px;display:grid;gap:8px}
.mock-split{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.mock-split{grid-template-columns:150px 1fr}}
.mock-side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.8rem;display:grid;gap:5px;align-content:start}
.mock-side div{padding:5px 7px;border-radius:7px;background:var(--bg2)}
.mock-side div.on{background:var(--ink);color:var(--bg)}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.4}
.bub.u{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.bub.a{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.mock-in{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:8px 10px;background:var(--card);color:var(--ink3);font-size:.82rem}
.mock-in .sp{flex:1}
.mock-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:2px 3px 2px 0}
.mock-row{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.tog{width:34px;height:20px;border-radius:20px;background:var(--green);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.tog.off{background:var(--line2)}
.tog.off::after{right:auto;left:3px}
.mock-cap{font-size:.82rem;color:var(--ink3);padding:0 12px 10px}

/* stack ladder */
.ladder{counter-reset:rung;display:grid;gap:8px;margin:1em 0}

/* flow diagram */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:1em 0}
.flow .st{flex:1 1 140px;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--card);position:relative}
.flow .st b{display:block;font-family:var(--font-head);text-transform:uppercase;font-size:.8rem;letter-spacing:.12em;color:var(--accent)}
.flow .ar{display:grid;place-items:center;font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--ink3);flex:0 0 auto}
@media (max-width:560px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg);height:22px}}

/* table */
.tbl-wrap{overflow-x:auto;margin:1em 0;border:2px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.06em;background:var(--bg2);font-size:.9rem}
tr:last-child td{border-bottom:0}

/* traffic light */
.lights{display:grid;gap:12px}
@media (min-width:700px){.lights{grid-template-columns:repeat(3,1fr)}}
.light{border-radius:14px;padding:14px;border:2px solid}
.light.r{border-color:var(--red);background:var(--red-soft)}
.light.y{border-color:var(--gold);background:var(--gold-soft)}
.light.g{border-color:var(--green);background:var(--green-soft)}
.light h4{display:flex;gap:8px;align-items:center}
.light ul{margin:0;font-size:.93rem}

/* stacks tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:3px solid var(--ink);margin-top:1em}
.tab{border:2px solid var(--ink);border-bottom:0;background:var(--card2);border-radius:12px 12px 0 0;padding:9px 16px;font-family:var(--font-head);font-weight:800;text-transform:uppercase;font-size:1.05rem;cursor:pointer;min-height:44px;margin-bottom:-3px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabpanel{border:3px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;background:var(--card);padding:16px}
.stack-line{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.stack-line:last-child{border-bottom:0}
.stack-line .pr{font-family:var(--font-head);font-weight:800;font-size:1.15rem;white-space:nowrap}

/* timeline */
.tl{position:relative;margin:1em 0;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--ink);border-radius:3px}
.tl-i{position:relative;margin-bottom:14px}
.tl-i::before{content:"";position:absolute;left:-24px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--pc,var(--accent-bg));border:3px solid var(--ink)}
.tl-i .tm{font-family:var(--font-head);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pc,var(--accent))}

/* prompt library */
.prompt{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:14px;margin:10px 0;animation:fadeUp .25s ease}
.prompt h3{font-size:1.2rem;margin:0 0 4px;text-transform:uppercase}
.prompt pre{white-space:pre-wrap;word-wrap:break-word;background:var(--bg2);border-radius:10px;padding:12px;font-family:var(--font-mono);font-size:.85rem;line-height:1.5;margin:8px 0;max-height:280px;overflow:auto}

/* ROI */
.roi-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0}
@media (min-width:640px){.roi-row{grid-template-columns:2fr 1fr 1fr auto;align-items:end}}
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line2);border-radius:10px;background:var(--card2);color:var(--ink);min-height:46px}
.inp:focus{border-color:var(--ink)}
textarea.inp{min-height:110px;font-family:var(--font-mono);font-size:.85rem}
select.inp{appearance:auto}
.roi-out{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:640px){.roi-out{grid-template-columns:repeat(4,1fr)}}
.kpi{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--card);text-align:center}
.kpi b{display:block;font-family:var(--font-head);font-weight:800;font-size:2rem;line-height:1.05;color:var(--accent)}
.kpi span{font-size:.8rem;color:var(--ink3);font-weight:600}
.bars{margin-top:14px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .tr{height:14px;background:var(--bg2);border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--pc,var(--accent-bg));border-radius:8px;transition:width .5s}

/* plan */
.plan-week{border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:14px 16px;margin:12px 0;box-shadow:0 3px 0 var(--ink)}
.plan-week h3{margin:0 0 6px;text-transform:uppercase}
.plan-week ol{margin:0}

/* footer */
footer.foot{border-top:2px solid var(--ink);margin-top:50px;padding-top:18px;font-size:.88rem;color:var(--ink3)}
.next-prev{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:30px}
.banner{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:14px}
.kbd-note{font-size:.8rem;color:var(--ink3)}
</style>

<script>
/* =====================================================================
   THE GRAY BROTHERS PLAYBOOK
   One self-contained file. No build step, no backend, no accounts.
   Facts about tools and prices were checked on the web on Oct 6, 2026.

   CODE MAP
   1. CONTENT  - core modules, tracks, tools, prompts, glossary (plain data)
   2. STATE    - per-profile progress in localStorage (with safe fallbacks)
   3. UI       - router, renderers, interactive widgets
   ===================================================================== */

const AS_OF = "October 6, 2026";

/* ---------------------------------------------------------------------
   1A. CORE MODULES
   Section types: p (raw html), h (heading), flip, ex (expandables),
   check (I-tried-this), fork (choose your path), cmp (before/after),
   call (callout), mock (drawn UI), comp (interactive widget), tl (timeline)
   Glossary terms in text: [[term]] or [[shown text|term-key]]
   --------------------------------------------------------------------- */
const CORE = [
{
  id:"ai101", n:1, title:"AI 101", sub:"What these tools are, and where they fall on their face", mins:15,
  sections:[
    {t:"p", h:`<p class="lede">Before you pick tools or write prompts, you need a gut-level feel for what's going on under the hood. No math. Promise.</p>`},
    {t:"h", h:"What it actually is"},
    {t:"p", h:`<p>ChatGPT, Claude, Gemini and the rest are all built on a [[large language model|llm]]. Think of it as the world's most well-read parts counter guy. He's read basically every catalog, manual, forum post and textbook ever printed. When you ask him something, he doesn't look it up. He answers from memory, one word at a time, picking the word most likely to come next.</p>
    <p>That's the whole trick. It's <strong>prediction</strong>, not lookup. That's why it's amazing at writing, explaining and reasoning, and also why it can say something wrong with total confidence.</p>
    <p>Modern versions add tools on top: they can <strong>search the web</strong>, <strong>read your files</strong>, <strong>run code</strong> to do math properly, and even <strong>click around websites</strong>. When one of those tools is switched on, the answer can be grounded in real, current info. When it's off, you're getting the counter guy's memory.</p>`},
    {t:"h", h:"Flip the cards: the 8 words you need"},
    {t:"flip", cards:[
      ["Model","The \"brain\" itself. Companies release new versions every few months (like model years on a truck). Bigger models are smarter but slower and pricier to run."],
      ["Prompt","Whatever you type (or say) to the AI. Better instructions in, better work out. Module 4 is all about this."],
      ["Context window","How much the AI can hold in its head at once: your messages, files, and its replies. Big ones fit whole books. When it fills up, older stuff gets fuzzy."],
      ["Hallucination","When AI makes something up and states it like fact: fake part numbers, fake laws, fake stats. The #1 thing to watch for."],
      ["Training cutoff","The date the model's built-in knowledge stops. Anything newer, it only knows if it searches the web."],
      ["Tokens","The chunks AI reads and writes in (roughly ¾ of a word). Usage limits and pricing are measured in tokens."],
      ["Agent","AI that doesn't just answer but takes steps: opens sites, reads files, fills forms, runs tasks, then reports back."],
      ["Connector","A plug that lets an AI see your other apps: Gmail, Google Drive, Calendar, Notion, and so on, with your permission."]
    ]},
    {t:"h", h:"Great at vs. bad at"},
    {t:"p", h:`<div class="grid g2">
      <div class="card"><h3 style="color:var(--green)">✔ Where it shines</h3><ul>
        <li><strong>First drafts</strong>: emails, scripts, posts, proposals, resumes</li>
        <li><strong>Rewriting</strong>: shorter, friendlier, firmer, for a 5th grader</li>
        <li><strong>Summarizing</strong>: long PDFs, contracts, meeting notes</li>
        <li><strong>Explaining</strong>: "explain this formula / this repair / this rule like I'm new"</li>
        <li><strong>Brainstorming</strong>: 20 ideas in 10 seconds (3 will be good)</li>
        <li><strong>Pulling data out of messy stuff</strong>: invoices, screenshots, PDFs to tables</li>
        <li><strong>Practice partner</strong>: interviews, sales calls, tough conversations</li>
      </ul></div>
      <div class="card"><h3 style="color:var(--red)">✘ Where it trips</h3><ul>
        <li><strong>Exact facts it doesn't have</strong>: part numbers, prices, phone numbers, laws</li>
        <li><strong>Recent events</strong> unless web search is on</li>
        <li><strong>Agreeing with you too easily</strong> (it's built to be helpful, so it can be a yes-man)</li>
        <li><strong>Long exact lists and counting</strong> without using a tool</li>
        <li><strong>Knowing your business</strong>: it only knows what you tell it</li>
        <li><strong>High-stakes calls</strong>: legal, tax, medical, safety. Use it to prep, not decide</li>
      </ul></div>
    </div>`},
    {t:"call", k:"tip", title:"The mental model that works", h:`<p>Treat AI like a <strong>sharp new hire</strong>: fast, tireless, well-read, eager to please, and on day one. Give clear instructions and context. Check their work before it goes to a customer.</p>`},
    {t:"fork", id:"ai101-hallu", q:"See a hallucination in your world", opts:[
      ["Auto parts","Kyle's world",`<p><strong>You ask:</strong> "What's the part number for the front brake pads on a 2017 F-150?"</p><p><strong>AI might say:</strong> a clean-looking part number, brand and price, delivered with total confidence.</p><p><strong>The problem:</strong> fitment depends on trim, brake package, and sometimes build date. The AI may have mashed together real-looking numbers. <strong>Fix:</strong> use AI to explain options and questions to ask, then confirm fitment in your actual catalog/EPC or VIN lookup. Never quote a customer an AI part number unchecked.</p>`],
      ["Finance","Cole's world",`<p><strong>You ask:</strong> "What's the current Section 179 deduction limit?"</p><p><strong>AI might say:</strong> a specific dollar figure, possibly from an older tax year baked into its training.</p><p><strong>The problem:</strong> limits change yearly, and the model's built-in knowledge has a [[training cutoff]]. <strong>Fix:</strong> turn on web search, ask for the IRS source link, and click it. For anything you'd sign your name to, the primary source wins.</p>`],
      ["Sales","Cody's world",`<p><strong>You ask:</strong> "Give me stats on how many homeowners pick a roofer based on Google reviews."</p><p><strong>AI might say:</strong> "87% of homeowners..." with a study name attached.</p><p><strong>The problem:</strong> it can invent a precise-sounding stat <em>and</em> a study to go with it. Put that in a pitch deck and a sharp prospect calls you on it. <strong>Fix:</strong> ask for sources with links, open them, and only use numbers you can trace.</p>`]
    ]},
    {t:"h", h:"How to double-check AI output"},
    {t:"ex", items:[
      ["Ask for sources, then actually click them",`<p>Turn on web search (or use Research mode) and say: <em>"Cite your sources with links."</em> Open two or three. If the link is dead or doesn't say what the AI claimed, treat the whole answer as suspect.</p>`],
      ["Tie numbers back to the original",`<p>If AI pulled totals from a PDF or spreadsheet, spot-check a few against the source, and always check the grand total. If it's off, ask the AI to show its work row by row.</p>`],
      ["Ask it to grade itself",`<p>Follow up with: <em>"What parts of your answer are you least sure about? What could be wrong?"</em> Models are surprisingly good at flagging their own weak spots when asked directly.</p>`],
      ["Get a second opinion",`<p>Paste the same question into a different AI. If Claude and Gemini disagree, that's exactly where to dig in.</p>`],
      ["Watch for \"too perfect\"",`<p>Super-precise stats, quotes with no source, or an answer that's suspiciously exactly what you wanted to hear: that's when to slow down.</p>`]
    ]},
    {t:"check", items:[
      ["ai101-1","Ask any AI a question about your job that you already know the answer to. Grade it honestly."],
      ["ai101-2","Follow up with: \"What in your answer might be wrong?\" and see what it admits."],
      ["ai101-3","Ask the same question to a second AI tool and compare."]
    ]}
  ],
  quiz:[
    {q:"In plain English, how does a chatbot like Claude or ChatGPT come up with an answer (with no tools turned on)?", a:1, o:[
      ["It looks the answer up in a giant database of verified facts.","Nope. There's no fact database behind it. That's exactly why it can be confidently wrong."],
      ["It predicts the most likely next words based on patterns from tons of text it learned from.","Right. It's prediction, not lookup. Great for writing and reasoning; risky for exact facts."],
      ["It searches Google every time and copies the top result.","Only when web search is switched on, and even then it summarizes rather than copies."],
      ["A human reviews each answer before you see it.","No humans in the loop. It's all generated on the spot."]]},
    {q:"What is a \"hallucination\"?", a:2, o:[
      ["When the app crashes or freezes.","That's just a bug. A hallucination is about the content."],
      ["When the AI refuses to answer.","That's a refusal. Different thing."],
      ["When AI states something made-up as if it were fact.","Correct. Fake part numbers, fake stats, fake laws, all said with confidence."],
      ["When AI generates an image.","Image generation is a feature, not a hallucination."]]},
    {q:"Kyle asks an AI for a part number and gets one instantly. What's the smart move?", a:3, o:[
      ["Quote it to the customer. AI is usually right.","\"Usually right\" isn't good enough when a wrong part means a comeback and an angry customer."],
      ["Ask the AI if it's sure. If it says yes, use it.","AI saying \"yes\" doesn't make it true. It tends to agree with you."],
      ["Never use AI for anything parts-related.","Too far. AI is great for explaining options, drafting customer messages, and analyzing inventory. Just not as the final word on fitment."],
      ["Use it as a starting point, then confirm fitment in the real catalog or VIN lookup.","Exactly. AI for speed and explanation; the source of truth for the final answer."]]},
    {q:"Why might an AI give you outdated info about something that happened last month?", a:0, o:[
      ["Its built-in knowledge stops at a training cutoff, and web search may not have been used.","Right. Turn on search or ask it to search when recency matters."],
      ["AI companies hide recent news on purpose.","No conspiracy. It's just how training works."],
      ["The free version is always a year behind.","Not how it works. Cutoffs depend on the model, not your plan."],
      ["It only knows things from books.","It learned from far more than books, but only up to a cutoff date."]]},
    {q:"Which is the BEST way to treat AI at work, according to this module?", a:1, o:[
      ["Like a search engine: type keywords, get links.","You'll leave most of its power on the table. Give it full instructions and context."],
      ["Like a sharp new hire: give clear direction and context, then check the work.","Yes. Fast, capable, eager, and needs supervision on anything that matters."],
      ["Like an expert you should never question.","That's how people get burned. Always verify important stuff."],
      ["Like a toy: fun but not useful for real work.","Plenty of real work gets done with it. You'll see in the tracks."]]}
  ]
},
{
  id:"landscape", n:2, title:"The Landscape Map", sub:"Who's who in AI, and which one to grab for which job", mins:15,
  sections:[
    {t:"p", h:`<p class="lede">There are a dozen big names and a thousand small ones. Good news: you need about three. Here's the honest map, with prices checked on ${"October 6, 2026"}.</p>`},
    {t:"h", h:"The big general assistants in one breath"},
    {t:"ex", items:[
      ["Claude (Anthropic)",`<p>Best-in-class writing and reasoning, strong with long documents, and deep "do work for me" features (Projects, connectors, Cowork, Claude in Chrome, Excel add-in, Claude Code). Free plan is real; Pro is $20/mo. Weak spot: it isn't the pick for generating photos or video.</p>`],
      ["ChatGPT (OpenAI)",`<p>The household name. Huge feature set: image generation, voice, agent mode, custom GPTs, deep research. Plans: Free, Go ($8), Plus ($20), Pro ($100 or $200). Great all-rounder, especially for images.</p>`],
      ["Gemini (Google)",`<p>The pick if your life runs on Gmail, Google Docs, Sheets and Drive. Strong video generation (Veo) on paid plans. Plans: Free, AI Plus ($4.99), AI Pro ($19.99, includes 5 TB storage), AI Ultra ($99.99–$199.99).</p>`],
      ["Microsoft Copilot",`<p>The pick if your work lives in Excel, Outlook, Word and Teams. A free Copilot app exists; <strong>Microsoft 365 Premium ($19.99/mo)</strong> is the consumer plan that puts Copilot inside the Office apps.</p>`],
      ["Perplexity",`<p>An answer engine. Ask a question, get a sourced answer with links. Best quick research tool. Free, Pro ($20), Max ($200). Also makes the free Comet AI browser.</p>`],
      ["Grok (xAI)",`<p>Built into X (Twitter) and plugged into what people are posting right now. Paid tiers from SuperGrok Lite ($10) up to SuperGrok Heavy ($300).</p>`],
      ["Meta AI",`<p>Free, and already inside Facebook, Instagram and WhatsApp. Meta launched a separate Muse agent app in Sept 2026. Handy for quick stuff where you already are, but not where you'd do serious work.</p>`]
    ]},
    {t:"h", h:"Interactive map"},
    {t:"p", h:`<p>Filter by category, by brother, or by free vs. paid. Every card says when to pick it.</p>`},
    {t:"comp", name:"landscape"},
    {t:"h", h:"Rules of thumb"},
    {t:"p", h:`<div class="tbl-wrap"><table>
      <thead><tr><th>If you need to…</th><th>Reach for</th></tr></thead>
      <tbody>
      <tr><td>Write, think, analyze long docs</td><td>Claude</td></tr>
      <tr><td>Make an image or graphic</td><td>ChatGPT, Gemini, Canva, Midjourney</td></tr>
      <tr><td>Make a video clip</td><td>Gemini (Veo), Runway, Kling</td></tr>
      <tr><td>Get a quick sourced answer</td><td>Perplexity (or any assistant with search on)</td></tr>
      <tr><td>Work inside Gmail/Docs/Sheets</td><td>Gemini</td></tr>
      <tr><td>Work inside Excel/Outlook/Word</td><td>Copilot (M365 Premium) or Claude's Excel add-in</td></tr>
      <tr><td>Study a stack of your own documents</td><td>NotebookLM (free) or a Claude Project</td></tr>
      <tr><td>Record and summarize meetings</td><td>Fathom, Granola, Otter</td></tr>
      <tr><td>Connect apps so things happen automatically</td><td>Zapier, Make, n8n</td></tr>
      </tbody></table></div>`},
    {t:"call", k:"warn", title:"Heads up: things change fast", h:`<p>OpenAI shut down its standalone Sora video app in April 2026. That's how fast this moves. Prices and features here were checked on ${"October 6, 2026"}. Before paying for anything, glance at the company's pricing page.</p>`},
    {t:"check", items:[
      ["land-1","Install Claude and one other assistant (ChatGPT or Gemini) on your iPhone."],
      ["land-2","Ask Perplexity a question about your industry and click two of its sources."],
      ["land-3","Use the map filter to find 2 tools tagged for you."]
    ]}
  ],
  quiz:[
    {q:"Cole's whole company runs on Microsoft Excel and Outlook. Which option puts AI directly inside those apps?", a:2, o:[
      ["Perplexity Pro","Great for research, but it doesn't live inside Excel."],
      ["Grok","Grok's strength is real-time X data, not Office."],
      ["Microsoft 365 Premium (Copilot in the Office apps) or Claude's Excel add-in","Right. Both work inside Excel. Copilot is native to the Office suite, and Claude's add-in comes with Claude Pro."],
      ["Meta AI","Meta AI lives in Facebook, Instagram and WhatsApp, not Excel."]]},
    {q:"Cody needs a quick 8-second video clip of a roof at sunset for a social post. Best first pick?", a:0, o:[
      ["Gemini's Veo (Google AI plan) or a video tool like Runway or Kling","Yes. Those are built for video generation."],
      ["Claude","Claude is a top writer and thinker, but it's not the tool for generating video."],
      ["Perplexity","Perplexity is for researched answers, not video."],
      ["Excel","Ha. No."]]},
    {q:"What makes Perplexity stand out?", a:3, o:[
      ["It's the only free AI.","Lots of AI tools have free plans."],
      ["It writes the best fiction.","Not its claim to fame."],
      ["It edits video.","Nope."],
      ["Fast answers with sources and links you can click to verify.","Correct. It's a research-first answer engine."]]},
    {q:"Kyle uses Gmail, Google Calendar and Google Sheets for everything personal. Which assistant has the deepest native hooks into those apps?", a:1, o:[
      ["Microsoft Copilot","Copilot's home turf is Microsoft 365."],
      ["Google Gemini","Right. It's built into Google's own apps. (Claude can also connect to Gmail/Drive/Calendar through connectors.)"],
      ["Grok","Grok connects to X, not Google apps."],
      ["Midjourney","Midjourney is an image generator."]]},
    {q:"How many AI subscriptions does a beginner realistically need to start?", a:2, o:[
      ["Every major one, to compare them all.","That's a quick way to burn $100+/mo on stuff you won't use."],
      ["None. Only free tools ever.","Free goes a long way, but one paid plan often pays for itself fast."],
      ["Zero to one paid plan, plus a few free tools.","Yes. Start free, upgrade one tool when you hit its limits."],
      ["At least five.","Way overkill to start."]]}
  ]
},
{
  id:"claude", n:3, title:"Claude Deep Dive", sub:"The full Claude stack, from chat to agents", mins:20,
  sections:[
    {t:"p", h:`<p class="lede">This course was built with Claude, so yes, there's some bias. But we'll show you exactly what it does, what it costs, and where something else is the better pick.</p>`},
    {t:"h", h:"Plans and models, plain English"},
    {t:"p", h:`<div class="tbl-wrap"><table>
      <thead><tr><th>Plan</th><th>Price</th><th>What you get</th></tr></thead>
      <tbody>
      <tr><td><strong>Free</strong></td><td>$0</td><td>Chat on web, desktop &amp; phone. Sonnet and Haiku models, web search, file creation, memory, connectors, Artifacts, up to 5 Projects, voice mode on mobile.</td></tr>
      <tr><td><strong>Pro</strong></td><td>$20/mo<br><span class="muted small">($17/mo billed yearly)</span></td><td>Everything in Free with more usage, plus Opus and Fable models, Research, Cowork, scheduled tasks, Claude in Chrome, Claude Code, and the Excel/Word/PowerPoint add-ins.</td></tr>
      <tr><td><strong>Max</strong></td><td>From $100/mo</td><td>Pro with 5x (or 20x) the usage and early access. Only for heavy daily users.</td></tr>
      </tbody></table></div>
      <p><strong>The models</strong> (think engine options):</p>
      <ul>
        <li><strong>Haiku 4.5</strong>: fastest and lightest. Quick questions.</li>
        <li><strong>Sonnet 5.5</strong>: the everyday workhorse (released Sept 2026). Default for most jobs.</li>
        <li><strong>Opus 5.5</strong>: the heavy hauler for complex analysis and big documents.</li>
        <li><strong>Fable 5.1</strong>: Anthropic's most capable model right now. On paid plans with tighter usage limits.</li>
      </ul>
      <p class="muted small">Rule: start on the default. Switch up only when an answer isn't good enough.</p>`},
    {t:"h", h:"The Claude stack: 10 rungs"},
    {t:"p", h:`<p>Each rung does more of the work <em>for</em> you. Most people never get past rung 1. Tap each to see what it is and what it looks like.</p>`},
    {t:"ex", items:[
      ["1 · Chat",`<p>The basics: type or talk, get answers. Attach PDFs, photos, spreadsheets. Snap a photo of a whiteboard or an invoice and ask about it.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>CLAUDE · CHAT</span></div><div class="mock-body">
        <div class="bub u">📎 supplier-invoice.pdf<br>Pull out every line item into a table and flag anything over $500.</div>
        <div class="bub a">Here's the table (14 line items). Two items over $500: <b>Rotor set: $612</b> and <b>Diag scanner: $1,140</b>. Also, line 9 appears twice. Possible duplicate charge.</div>
        <div class="mock-in"><span class="sp">Reply to Claude…</span><span>🎙</span><span>➤</span></div></div></div>`],
      ["2 · Projects",`<p>A folder with a brain. Upload your reference files (price lists, brand guide, resume, SOPs) and write standing instructions once. Every chat inside the Project already knows that stuff. Free plan gets up to 5.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>PROJECT · ROOFING BRAND</span></div><div class="mock-body"><div class="mock-split">
        <div class="mock-side"><div class="on">📁 Instructions</div><div>📄 brand-voice.md</div><div>📄 services.pdf</div><div>📄 past-posts.txt</div></div>
        <div style="display:grid;gap:8px"><div class="mock-row"><span><b>Instructions:</b> Write like Cody: plain-spoken, no fluff, talk to contractors like a peer.</span></div>
        <div class="bub u">Give me 5 Facebook posts for storm season.</div><div class="bub a">Using your brand voice and services list, here are 5…</div></div></div></div></div>`],
      ["3 · Memory",`<p>Claude can remember things across chats (your job, preferences, ongoing work) so you don't re-explain yourself. Available on the free plan since March 2026. You can view, edit, or turn it off in <strong>Settings → Capabilities → Memory</strong>.</p>`],
      ["4 · Artifacts & file creation",`<p>Instead of just text, Claude can build a thing: a formatted document, a spreadsheet, a slide outline, a chart, or a small interactive tool (a quote calculator, a checklist app). It shows up in a side panel you can tweak and download.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>ARTIFACT · ROOF QUOTE CALCULATOR</span></div><div class="mock-body">
        <div class="mock-row"><span>Roof squares</span><b>28</b></div><div class="mock-row"><span>Pitch</span><b>7/12</b></div><div class="mock-row"><span>Material</span><b>Architectural shingle</b></div>
        <div class="mock-row" style="border:2px solid var(--ink)"><span><b>Estimated range</b></span><b>$X – $Y</b></div></div><div class="mock-cap">You describe it, Claude builds it, and you can share it.</div></div>`],
      ["5 · Research",`<p>Research mode (paid plans) runs many web searches, reads the results, and comes back with a cited report. Great for "compare these 5 CRMs for a roofing company" or "what careers fit someone with 10 years in auto parts?"</p>`],
      ["6 · Connectors",`<p>Let Claude see your other apps (with your permission): Gmail, Google Calendar, Google Drive, Notion, Slack, Canva, Microsoft 365 and many more. Then you can say <em>"What did the supplier say about the backorder last week?"</em> and it checks your email.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>SETTINGS · CONNECTORS</span></div><div class="mock-body">
        <div class="mock-row"><span>✉️ Gmail</span><span class="tog"></span></div><div class="mock-row"><span>📅 Google Calendar</span><span class="tog"></span></div>
        <div class="mock-row"><span>📁 Google Drive</span><span class="tog off"></span></div><div class="mock-row"><span>📝 Notion</span><span class="tog off"></span></div></div><div class="mock-cap">Flip on only what you need. You can turn any of them off later.</div></div>`],
      ["7 · Skills",`<p>Skills are saved playbooks Claude can follow: "how we format a month-end report," "how I write a follow-up email." Package a process once and Claude does it the same way every time. There's a public Skills Marketplace with hundreds ready-made.</p>`],
      ["8 · Cowork & scheduled tasks",`<p><strong>Cowork</strong> (paid plans, Claude desktop app for Mac/Windows) is a workspace where Claude works with your files, connectors and instructions on bigger jobs. <strong>Scheduled tasks</strong> let you set a job to repeat, like a Monday-morning briefing. Since July 2026 they run in the cloud, so your laptop can be closed.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>COWORK · SCHEDULED TASK</span></div><div class="mock-body">
        <div class="mock-row"><span><b>Monday 6:30am</b></span><span class="mock-tag">Weekly</span></div>
        <div class="mock-row"><span>"Check my Gmail for new leads and unanswered quotes from last week. Make a call list ranked by deal size, with a 1-line opener for each."</span></div>
        <div class="mock-row"><span>Uses: Gmail · Calendar · Web search</span><span class="tog"></span></div></div></div>`],
      ["9 · Claude in Chrome",`<p>A Chrome extension (paid plans) that puts Claude in a side panel and lets it act in your browser: read the page, click, fill forms, compare tabs. Since Aug 2026 it's a full Cowork session, so your skills and connectors come along. It asks before doing anything risky, and you should still watch it.</p>
        <div class="mock" aria-hidden="true"><div class="mock-bar"><i></i><i></i><i></i><span>CHROME · SIDE PANEL</span></div><div class="mock-body"><div class="mock-split" style="grid-template-columns:1fr 1fr">
        <div class="mock-side"><div>Supplier site</div><div>🔍 search: "serpentine belt"</div><div class="on">Results: 12 items</div></div>
        <div style="display:grid;gap:6px"><div class="bub u">Compare price + stock for these 3 belts across both tabs.</div><div class="bub a">Done. Cheapest in-stock is… (table)</div></div></div></div></div>`],
      ["10 · Claude Code",`<p>The power tool: an AI that writes and runs software. You describe what you want in plain English and it builds it. <strong>This entire course was built with Claude Code from one prompt.</strong> You don't need it day one, but know it exists: it's how non-coders are now building simple apps, websites and automations.</p>`]
    ]},
    {t:"fork", id:"claude-first", q:"What do you want Claude to do for you first?", opts:[
      ["Work with my email & calendar","Connectors path",`<h4>Your first 10 minutes</h4><ol><li>Open claude.ai (or the app) → <strong>Settings → Connectors</strong>.</li><li>Turn on Gmail and Google Calendar (or Microsoft 365 if that's your world). Approve the permissions.</li><li>Ask: <em>"Look at my calendar for this week and my unread emails. What needs my attention first?"</em></li><li>Check what it found against your actual inbox. Trust, but verify.</li></ol>`],
      ["Handle a repeat task for me","Scheduled tasks path",`<h4>Your first 10 minutes</h4><ol><li>On a paid plan, download the Claude desktop app and open <strong>Cowork</strong>.</li><li>Pick something you do every week (a report, a lead list, a news roundup).</li><li>Write the instructions like you're training a new hire, then set it to run weekly.</li><li>Review the first 2–3 runs closely before you rely on it.</li></ol>`],
      ["Make something real","Artifacts path",`<h4>Your first 10 minutes</h4><ol><li>In any chat, describe a tool you wish you had: <em>"Build me a simple calculator where I enter hours and hourly rate for 5 tasks and it shows weekly savings."</em></li><li>Claude builds it in a side panel. Click around it.</li><li>Say what to change ("make the buttons bigger," "add a total row").</li><li>Publish or download it. You just built software.</li></ol>`]
    ]},
    {t:"call", k:"", title:"Where Claude is NOT the best pick (honest list)", h:`<ul>
      <li><strong>Making images or video</strong>: use ChatGPT, Gemini (Veo), Midjourney, Runway or Canva.</li>
      <li><strong>Living inside Google Docs/Sheets/Gmail</strong>: Gemini is built in. Claude connects, but Gemini is native.</li>
      <li><strong>Living inside Outlook/Word/Teams</strong>: Copilot is native. (Claude does have Excel/Word/PowerPoint add-ins on Pro.)</li>
      <li><strong>What people are saying on X right now</strong>: Grok.</li>
      <li><strong>Quick sourced lookup on your phone</strong>: Perplexity is hard to beat.</li>
    </ul>`},
    {t:"check", items:[
      ["cl-1","Create a Claude Project for your work and add standing instructions about who you are."],
      ["cl-2","Upload a real document (PDF, spreadsheet, photo) and ask Claude to summarize or extract from it."],
      ["cl-3","Try voice mode on your iPhone: tap the waveform icon and talk through a problem."],
      ["cl-4","Ask Claude to build you a small Artifact (a calculator, checklist or tracker)."]
    ]}
  ],
  quiz:[
    {q:"What's the main benefit of a Claude Project?", a:1, o:[
      ["It makes Claude answer faster.","Speed isn't the point."],
      ["Your files and standing instructions are loaded into every chat in that Project.","Exactly. Set it up once and stop re-explaining yourself."],
      ["It lets you generate videos.","Claude isn't a video tool."],
      ["It's only for coders.","Projects are for anyone. A resume, a price list, a brand guide…"]]},
    {q:"Which Claude feature lets it read your Gmail or Google Calendar (with permission)?", a:0, o:[
      ["Connectors","Right. Connectors plug Claude into your other apps."],
      ["Artifacts","Artifacts are things Claude builds (docs, tools, charts)."],
      ["Haiku","Haiku is a model, not a feature."],
      ["Voice mode","Voice is how you talk to it, not what it can see."]]},
    {q:"Cody wants a lead summary waiting for him every Monday at 6:30am, even with his laptop closed. Which feature?", a:2, o:[
      ["Memory","Memory remembers context, but doesn't run things on a schedule."],
      ["Claude Code","Overkill. This doesn't need custom software."],
      ["Cowork scheduled tasks","Yes. Set it once, and since July 2026 it runs in the cloud on schedule."],
      ["Projects","Projects hold context but don't run on a timer."]]},
    {q:"Which is an honest case where a different tool beats Claude?", a:3, o:[
      ["Summarizing a long contract","That's a Claude strength."],
      ["Rewriting an email to sound friendlier","Also a Claude strength."],
      ["Analyzing a spreadsheet","Claude does this well, including in Excel via the add-in."],
      ["Generating a realistic product photo or video clip","Right. Image/video generators (ChatGPT, Gemini Veo, Midjourney, Runway) are the better pick."]]},
    {q:"What's the price of Claude Pro billed monthly (as of Oct 2026)?", a:1, o:[
      ["$8/month","That's ChatGPT Go."],
      ["$20/month","Correct ($17/mo if you pay for the year up front)."],
      ["$100/month","That's where Max starts."],
      ["It's free","There's a Free plan, but Pro is paid."]]}
  ]
},
{
  id:"prompting", n:4, title:"Prompting That Actually Works", sub:"The CRAFT play, before/after examples, and a builder", mins:20,
  sections:[
    {t:"p", h:`<p class="lede">The difference between "AI is overhyped" and "how did I live without this" is almost always the [[prompt]]. Here's one play to remember.</p>`},
    {t:"h", h:"The CRAFT play"},
    {t:"p", h:`<div class="grid">
      <div class="card"><h3><span style="color:var(--accent)">C</span>ontext</h3><p>The situation. Who you are, who it's for, what's going on. <em>"I run the counter at an auto parts store. A regular shop customer is upset about a backordered part."</em></p></div>
      <div class="card"><h3><span style="color:var(--accent)">R</span>ole</h3><p>Who should the AI act as? <em>"Act as a veteran customer-service manager."</em> It sets the expertise and tone.</p></div>
      <div class="card"><h3><span style="color:var(--accent)">A</span>sk</h3><p>The exact job, with a verb. <em>"Write a text message that apologizes, explains the delay, and offers two options."</em></p></div>
      <div class="card"><h3><span style="color:var(--accent)">F</span>ormat</h3><p>What the output should look like. Length, bullets, table, reading level. <em>"Under 300 characters. No corporate language."</em></p></div>
      <div class="card"><h3><span style="color:var(--accent)">T</span>weak</h3><p>Don't accept draft one. Push back: <em>"Shorter." "Warmer." "Give me 3 versions." "What would make this better?"</em> The magic is in round 2 and 3.</p></div>
    </div>`},
    {t:"h", h:"Before → After"},
    {t:"cmp", title:"Kyle: customer email", bad:"write an email about a late part", good:`Context: I work at an auto parts distributor. A repair shop that orders from us weekly is waiting on a backordered water pump for a customer's car. New ETA is Thursday.
Role: Act as an experienced B2B customer service rep.
Ask: Write an email that apologizes, gives the new ETA, and offers two options: a compatible aftermarket pump we have in stock today, or a loaner credit.
Format: Under 120 words. Friendly, direct, no corporate fluff. Subject line included.`, why:"The weak prompt makes the AI guess everything. The strong one gives it the situation, the relationship, the options, and the tone, so draft one is almost sendable."},
    {t:"cmp", title:"Cole: variance commentary", bad:"explain why expenses went up", good:`Context: I'm preparing monthly financial commentary for a small company's leadership team. Below is a table of this month vs. last month vs. budget by expense category (numbers are anonymized).
Role: Act as a senior financial analyst.
Ask: Identify the 3 largest variances vs. budget, suggest plausible drivers I should investigate, and list the questions I should ask each department head.
Format: Bullet points. Flag anything you're inferring vs. what the data shows.
[paste table]`, why:"The good version tells it the audience, gives the actual data, and asks it to separate facts from guesses. That's critical in finance."},
    {t:"cmp", title:"Cody: cold opener", bad:"write a cold email to a roofer", good:`Context: I sell digital marketing (Google Business Profile, local SEO, Facebook ads) to roofing contractors. This prospect: [Company], 3 crews, 4.2 stars on Google with 38 reviews, website has no photos of recent jobs, and they're not running any ads I can find.
Role: Act as a top-performing B2B sales rep who used to work in the trades.
Ask: Write a 4-sentence cold email that references one specific gap I noticed and offers a free 10-minute audit.
Format: Plain text, sounds like a human, no buzzwords, one clear question at the end. Give me 3 versions with different hooks.`, why:"Specific details about the prospect turn a generic spam email into something that feels researched. Asking for 3 versions lets you pick the best and test them."},
    {t:"h", h:"Seven moves the pros use"},
    {t:"ex", items:[
      ["Make it interview you first",`<p>End your prompt with: <em>"Before you start, ask me any questions you need to do this well."</em> This is the single biggest upgrade for beginners. The AI pulls the context out of you.</p>`],
      ["Show an example",`<p>Paste something you liked: <em>"Here's an email I wrote that got a great response. Match this style."</em> Examples beat descriptions every time.</p>`],
      ["Give it the real material",`<p>Don't describe the spreadsheet. Upload it. Don't summarize the job posting. Paste it. AI is only as good as what it can see.</p>`],
      ["Ask for options, not an answer",`<p><em>"Give me 5 subject lines"</em> beats <em>"Write a subject line."</em> Pick the best, then ask for 5 more like that one.</p>`],
      ["Make it argue with itself",`<p><em>"Now act as a skeptical customer and poke holes in this."</em> or <em>"What would a CFO object to here?"</em> Great for pitches, plans and resumes.</p>`],
      ["Go step by step on hard stuff",`<p>For analysis: <em>"Walk through this step by step and show your work."</em> You'll catch mistakes much faster.</p>`],
      ["Save your winners",`<p>When a prompt works, save it: in a Claude Project's instructions, a note on your phone, or the library in this course. Reuse beats rewriting.</p>`]
    ]},
    {t:"h", h:"Prompt Builder"},
    {t:"p", h:`<p>Fill in the blanks. It assembles a CRAFT prompt you can copy straight into any AI.</p>`},
    {t:"comp", name:"builder"},
    {t:"call", k:"tip", title:"Talk, don't type", h:`<p>On your iPhone, use voice mode or dictation and just ramble the context like you'd explain it to a coworker. Messy-but-complete context beats short-and-tidy every time.</p>`},
    {t:"check", items:[
      ["pr-1","Take a real task from this week and run it with a lazy prompt, then a CRAFT prompt. Compare."],
      ["pr-2","Try ending a prompt with \"Ask me questions before you start.\""],
      ["pr-3","Copy 3 prompts from the Prompt Library and save them on your phone."]
    ]}
  ],
  quiz:[
    {q:"What does the T in CRAFT stand for, and why does it matter?", a:2, o:[
      ["Tone: always make it formal.","Tone matters, but T is about not settling for draft one."],
      ["Time: tell it how long to take.","Not part of the framework."],
      ["Tweak: push back and iterate, because the best output usually comes in round 2 or 3.","Yes. Treat the first answer as a draft."],
      ["Topic: name the subject.","That's covered by Context and Ask."]]},
    {q:"Which single line is the biggest upgrade for most beginner prompts?", a:0, o:[
      ["\"Before you start, ask me any questions you need to do this well.\"","Right. It makes the AI pull the missing context out of you."],
      ["\"Please.\"","Polite is nice, but it won't change the quality much."],
      ["\"Be accurate.\"","It's already trying. This won't stop hallucinations."],
      ["\"Use AI.\"","…it is AI."]]},
    {q:"Cole wants AI to analyze a spreadsheet. Best approach?", a:3, o:[
      ["Describe the spreadsheet's contents from memory.","The AI can only work with what it sees. Descriptions lose detail."],
      ["Ask it to guess typical numbers for his industry.","Guesses aren't analysis."],
      ["Paste the column headers only.","Better than nothing, but still not the data."],
      ["Upload the (anonymized) file and say exactly what analysis he needs.","Correct. Give it the real material, minus anything sensitive."]]},
    {q:"Why ask for \"5 versions\" instead of one?", a:1, o:[
      ["AI charges less for more versions.","Pricing doesn't work like that."],
      ["Options let you pick the best and steer toward it. It's faster than fixing one mediocre draft.","Right. Choose, then ask for more like the winner."],
      ["It makes the AI more accurate on facts.","Versions help with creative work, not factual accuracy."],
      ["It's required by most tools.","Nope, it's just a smart move."]]},
    {q:"Which prompt is strongest?", a:2, o:[
      ["\"Write a LinkedIn post.\"","No context, no audience, no format."],
      ["\"Write a really good LinkedIn post about sales.\"","\"Really good\" isn't an instruction."],
      ["\"I sell marketing to roofers. Write a 120-word LinkedIn post for contractors about why Google reviews matter, in a plain-spoken voice, ending with a question. Give me 3 hooks.\"","Yes: context, audience, ask, format, and options."],
      ["\"LinkedIn post sales roofing reviews.\"","Keyword-style prompts treat it like Google. It's not."]]}
  ]
