{
  id:"automation", n:5, title:"Automation Awareness", sub:"Triggers, actions, agents, and what you could hand off", mins:15,
  sections:[
    {t:"p", h:`<p class="lede">You won't build automations today. The goal is to <em>spot</em> them, so when you hear yourself say "every week I have to…" a light goes on.</p>`},
    {t:"h", h:"Every automation is just this"},
    {t:"p", h:`<div class="flow" role="img" aria-label="Trigger, then AI step, then action">
      <div class="st"><b>Trigger</b>Something happens.<br><span class="muted small">A form is filled out, an email arrives, it's Monday 7am</span></div>
      <div class="ar" aria-hidden="true">→</div>
      <div class="st"><b>AI step</b>(optional) AI thinks.<br><span class="muted small">Summarize it, draft a reply, sort it, pull out data</span></div>
      <div class="ar" aria-hidden="true">→</div>
      <div class="st"><b>Action</b>Something gets done.<br><span class="muted small">Send a text, add a row, create a task, save a draft</span></div>
    </div>
    <p><strong>Real example (Cody's roofing biz):</strong> <em>Trigger:</em> new lead fills out the website form → <em>AI step:</em> draft a personal reply based on what they wrote → <em>Action:</em> text the lead within 60 seconds + add them to a Google Sheet + remind Cody to call.</p>
    <p>Speed-to-lead like that is one of the clearest wins in the contractor world. The first company to respond often gets the job.</p>`},
    {t:"h", h:"What's automatable today?"},
    {t:"flip", cards:[
      ["✔ Very doable","Data moving between apps, form → sheet → email, reminders, sorting emails, drafting replies for you to approve, weekly report summaries, social post scheduling."],
      ["◐ Doable with care","AI replying to customers on its own, pulling data from varied PDFs, agents that browse sites for you. Works, but needs checks and a human in the loop."],
      ["✘ Not yet (don't try)","Anything where one mistake is expensive and unchecked: sending money, final quotes, legal or tax filings, firing off messages to your whole client list."]
    ]},
    {t:"h", h:"The tools that do it"},
    {t:"ex", items:[
      ["Zapier: easiest start",`<p>Thousands of app connections, very beginner-friendly. Free plan: 100 tasks/month. Professional: $29.99/mo (or $19.99/mo billed yearly). It also has <strong>Zapier Agents</strong> (free tier with 400 activities/month) for AI that takes multi-step actions.</p>`],
      ["Make: more power per dollar",`<p>Visual drag-and-drop flowcharts. Free plan: 1,000 credits/month. Core: $16/mo (or $12/mo billed yearly). Slightly steeper learning curve, much cheaper at volume.</p>`],
      ["n8n: for the tinkerer",`<p>Very powerful, popular for AI agents. Cloud plans from €24/mo, or free if you host it yourself (that takes some tech comfort). Bookmark it for later.</p>`],
      ["Claude Cowork scheduled tasks",`<p>Describe the job in plain English and set a schedule. Uses your connectors (Gmail, Calendar, Drive…). No flowchart building. Included with Claude Pro.</p>`],
      ["ChatGPT agent mode",`<p>On ChatGPT Plus and up: ChatGPT can open a browser, click, fill forms, run code and hand back a finished result, asking for your OK on important steps.</p>`]
    ]},
    {t:"h", h:"Agents: AI that does multi-step work"},
    {t:"p", h:`<p>An [[agent]] gets a goal, not a single question, then figures out the steps. Examples you could run today:</p>
    <ul>
      <li><strong>Kyle:</strong> "Look at these 3 supplier sites and build me a table of price and stock for these 10 part numbers." (Claude in Chrome)</li>
      <li><strong>Cole:</strong> "Every Monday, pull last week's numbers from this Drive folder and draft a one-page summary with anything unusual flagged." (Cowork scheduled task)</li>
      <li><strong>Cody:</strong> "Find 25 roofing companies in my area with under 50 Google reviews and no website photos, and put them in a sheet with the owner's name if listed." (Research / agent mode)</li>
    </ul>
    <p class="muted">Always review agent output before acting on it. Agents are fast interns, not managers.</p>`},
    {t:"h", h:"What could YOU automate?"},
    {t:"p", h:`<p>Tap the ideas that fit your life. Starred ideas feed into your 30-day plan at the end.</p>`},
    {t:"comp", name:"autobrain"},
    {t:"check", items:[
      ["au-1","Write down 3 things you do every single week that follow the same steps."],
      ["au-2","Star at least 2 automation ideas above."],
      ["au-3","Browse Zapier's or Make's template gallery for one app you use."]
    ]}
  ],
  quiz:[
    {q:"In \"new form submission → AI drafts reply → text sent to lead,\" which part is the trigger?", a:0, o:[
      ["New form submission","Right. It's the event that kicks everything off."],
      ["AI drafts reply","That's the AI step in the middle."],
      ["Text sent to lead","That's the action at the end."],
      ["There's no trigger","Every automation has one."]]},
    {q:"Which is the WORST candidate to fully automate with no human check?", a:3, o:[
      ["Saving email attachments to a Drive folder","Low risk. Great automation."],
      ["A Monday reminder to review overdue invoices","Totally safe."],
      ["Drafting replies into your drafts folder","Safe, because you still hit send."],
      ["Auto-sending final price quotes to customers","Yes. One AI mistake costs real money and trust. Keep a human on this."]]},
    {q:"What makes an AI \"agent\" different from a regular chat?", a:2, o:[
      ["It uses a different alphabet.","Ha. No."],
      ["It's always more accurate.","Not necessarily. More steps means more chances for mistakes."],
      ["It takes a goal and works through multiple steps (browsing, clicking, reading files) to get it done.","Correct."],
      ["It only works on phones.","Platform doesn't matter."]]},
    {q:"Which tool is the most beginner-friendly for connecting apps?", a:1, o:[
      ["n8n self-hosted","Powerful, but you'd be running your own server."],
      ["Zapier","Yes. Widest app support and the gentlest learning curve."],
      ["Excel macros","Not really an app-connector."],
      ["Midjourney","That's an image generator."]]},
    {q:"Why does speed-to-lead automation matter so much for contractors?", a:2, o:[
      ["Leads expire after 24 hours by law.","No such law."],
      ["Google ranks you higher for fast texts.","Not how it works."],
      ["The first company to respond often wins the job, and automation responds in seconds, even at 9pm.","Exactly. Homeowners often call 2–3 contractors; fast and personal wins."],
      ["It eliminates the need for sales calls.","It gets you to the call faster. It doesn't replace it."]]}
  ]
},
{
  id:"safety", n:6, title:"Safety, Privacy & Money", sub:"What not to share, how to verify, and how not to overspend", mins:15,
  sections:[
    {t:"p", h:`<p class="lede">AI is a power tool. Power tools have guards for a reason. Five minutes here saves you a very bad day.</p>`},
    {t:"h", h:"The traffic light: what to paste"},
    {t:"p", h:`<div class="lights">
      <div class="light r"><h4>🔴 Never</h4><ul><li>SSNs, driver's license, passport numbers</li><li>Passwords, PINs, 2-factor codes</li><li>Full bank or credit card numbers</li><li>Customer or client personal financial data with names</li><li>Anything your employer's policy forbids</li></ul></div>
      <div class="light y"><h4>🟡 Strip it first</h4><ul><li>Customer names → "Customer A"</li><li>Real account numbers → "ACCT-001"</li><li>Internal pricing/margins (check policy)</li><li>Employee info</li><li>Contracts: remove names and amounts if unsure</li></ul></div>
      <div class="light g"><h4>🟢 Go for it</h4><ul><li>Public info (websites, listings, posts)</li><li>Your own drafts and ideas</li><li>Anonymized or made-up sample data</li><li>Generic questions about how to do something</li><li>Your own resume (minus your home address)</li></ul></div>
    </div>`},
    {t:"h", h:"Privacy settings worth 2 minutes"},
    {t:"ex", items:[
      ["Check whether your chats train the model",`<p>Most consumer AI apps have a setting about whether your conversations can be used to improve their models. Find it under Settings → Privacy (or Data Controls) in each tool and decide on purpose. Business and Enterprise plans typically have stricter defaults.</p>`],
      ["Know what your connectors can see",`<p>When you connect Gmail or Drive, the AI can read what's there when it needs to. Only connect what you'll actually use, and review connected apps every few months.</p>`],
      ["Your employer's rules win",`<p>If your company has an approved AI tool, use that one for work data. Pasting company financials into a personal account can be a fireable offense even if nothing bad happens. (Cole, this one's for you.)</p>`],
      ["Memory is editable",`<p>If an assistant remembers something you'd rather it didn't, you can view and delete memories in settings. In Claude: Settings → Capabilities → Memory.</p>`]
    ]},
    {t:"h", h:"New scams AI made easier"},
    {t:"call", k:"warn", title:"Set a family code word tonight", h:`<p>AI can clone a voice from a short clip. Scammers call parents and grandparents pretending to be a son in trouble who needs money now. Pick a family code word (not something on social media) and agree: <strong>no code word, no money, no matter how real it sounds.</strong></p><p>Also: AI-written phishing emails no longer have typos. Verify any payment change request by calling a number you already have.</p>`},
    {t:"h", h:"Verify before it leaves your hands"},
    {t:"p", h:`<ol>
      <li><strong>Numbers:</strong> spot-check against the source and tie out totals.</li>
      <li><strong>Facts and stats:</strong> click the source. No source, no use.</li>
      <li><strong>Names, part numbers, prices:</strong> confirm in the system of record.</li>
      <li><strong>Tone:</strong> read it out loud. Does it sound like you?</li>
      <li><strong>Legal, tax, medical, safety:</strong> AI preps you; a pro decides.</li>
    </ol>`},
    {t:"h", h:"Smart spending"},
    {t:"p", h:`<ul>
      <li><strong>Start free.</strong> Upgrade only when you actually hit a limit doing real work.</li>
      <li><strong>One paid assistant</strong> is plenty for most people. Two at most.</li>
      <li><strong>Annual billing</strong> saves ~15–30%, but only after you've used a tool for a month and know you'll keep it.</li>
      <li><strong>The 30-day test:</strong> if you didn't use a subscription 3+ times last week, cancel it.</li>
      <li><strong>ROI math:</strong> a $20/mo tool that saves you 2 hours a month is already profitable for all three of you. See the ROI calculator.</li>
    </ul>`},
    {t:"h", h:"Starter stacks"},
    {t:"comp", name:"stacks"},
    {t:"check", items:[
      ["sf-1","Set up a family code word with your brothers and parents."],
      ["sf-2","Find the privacy / data-training setting in your main AI app and make a deliberate choice."],
      ["sf-3","List every subscription you pay for right now, AI or not, and cancel one you don't use."]
    ]}
  ],
  quiz:[
    {q:"Cole needs help with a reconciliation that includes client names and account numbers. Best move?", a:1, o:[
      ["Paste it all into his personal ChatGPT. It's faster.","Risky and possibly against company policy. Client data in a personal account is a real problem."],
      ["Replace names and account numbers with placeholders (or use the company-approved tool), then ask for help.","Correct. Strip it or use the approved tool."],
      ["Never use AI for anything finance-related.","Too far. AI is great for formulas, structure, and anonymized analysis."],
      ["Email the file to the AI company.","No."]]},
    {q:"Mom gets a call from \"Kyle\" saying he's in trouble and needs money wired now. It sounds exactly like him. What protects her?", a:3, o:[
      ["Caller ID","Caller ID can be spoofed."],
      ["Asking where he is","A scammer will just make something up."],
      ["Listening for robotic sounds","Modern voice clones can sound fully human."],
      ["A pre-agreed family code word, plus calling Kyle back on his known number","Yes. No code word, no money."]]},
    {q:"Which is a 🟢 green-light thing to paste into an AI?", a:2, o:[
      ["Your online banking password","Never. Red light."],
      ["A customer's full credit card number","Never."],
      ["A competitor's public website text to analyze their positioning","Right. Public info is fair game."],
      ["Your Social Security number for a form","Never."]]},
    {q:"What's the smartest way to start paying for AI?", a:0, o:[
      ["Use free plans until you hit a real limit, then upgrade one tool.","Yes. Pay for proven value, not hype."],
      ["Buy annual plans of three tools right away to save money.","Annual saves money only on tools you'll actually keep using."],
      ["Get the most expensive plan so you never hit limits.","Most beginners won't come close to needing $100–$200/mo plans."],
      ["Never pay. Free is always enough.","Free goes far, but one good paid plan often pays for itself."]]},
    {q:"An AI gives you a precise stat with no source for a client pitch. What do you do?", a:1, o:[
      ["Use it. It sounds right.","Sounding right is exactly how hallucinations get you."],
      ["Ask for a source link, open it, and only use the number if it checks out.","Correct. No source, no use."],
      ["Round it to make it safer.","A rounded made-up number is still made up."],
      ["Put it in small print.","Still a problem if it's wrong."]]}
  ]
}
];

cole:{
  id:"cole", who:"Cole", title:"Cole's Track: The AI-Powered Numbers Guy", sub:"Spreadsheets, reconciliations, reporting, PDFs, forecasting, and doing it all safely", mins:55,
  sections:[
    {t:"p", h:`<p class="lede">Finance is where AI is most useful <em>and</em> most dangerous. It can save you hours a week, but one hallucinated number in a report is a credibility hit. This track is about speed <strong>with</strong> control.</p>`},
    {t:"call", k:"warn", title:"Rule #1 for Cole", h:`<p>AI <strong>drafts, structures, explains and flags</strong>. You <strong>verify, tie out and sign off</strong>. Never paste client PII, account numbers, or non-public company financials into a personal AI account. Use your company's approved tool, or anonymize first.</p>`},
    {t:"fork", id:"cole-shop", q:"Excel shop or Google Sheets shop?", opts:[
      ["Excel all day","Microsoft 365",`<p><strong>Your options inside Excel:</strong></p><ul><li><strong>Claude for Excel add-in</strong>: comes with Claude Pro ($20/mo). Reads, explains and modifies workbooks while keeping formulas intact. Generally available since May 2026.</li><li><strong>Copilot in Excel</strong>: via Microsoft 365 Premium ($19.99/mo) for personal use, or your employer's Microsoft 365 Copilot license at work.</li></ul><p><strong>At work, use whatever your IT department has approved.</strong> For personal learning and side projects, either works.</p>`],
      ["Google Sheets","Google Workspace",`<p><strong>Your options inside Sheets:</strong></p><ul><li><strong>Gemini side panel</strong>: generates formulas from plain English, builds charts, explains errors.</li><li><strong>The =AI() function and "Fill with Gemini"</strong>: categorize, summarize or extract text across thousands of rows from inside a cell.</li></ul><p>Availability depends on your Google plan or your employer's Workspace settings.</p>`],
      ["Both / it depends","Mixed",`<p>Then keep one general assistant (Claude or ChatGPT) for analysis and explanation, and use the built-in AI of whatever app the file lives in. Upload anonymized exports to the assistant when you need deeper analysis.</p>`]
    ]},
    {t:"h", h:"Where AI earns its keep in finance"},
    {t:"ex", items:[
      ["📊 Formulas & spreadsheet work",`<p>"Write an XLOOKUP that pulls vendor name from Sheet2 by ID and returns 'Missing' if not found." "Explain what this nested formula does, line by line." "Why is this SUMIFS returning 0?" This alone can save hours a month.</p>`],
      ["🔁 Reconciliation",`<p>Upload two anonymized exports (bank vs. ledger, AP vs. vendor statement) and ask: <em>"Match these on amount and date within 3 days. List unmatched items from each side, and possible duplicates."</em> Assistants that run code can do the matching properly. <strong>You then verify every exception.</strong></p>`],
      ["📝 Reporting & commentary",`<p>Give it the variance table and context; get a first draft of the commentary. Ask it to separate "what the data shows" from "possible drivers to confirm." Then rewrite in your own voice.</p>`],
      ["📄 PDF & document extraction",`<p>Invoices, statements, receipts, PDFs into clean tables. Huge time saver. <strong>Always check that extracted totals match the document totals.</strong> If the PDF is a scan, double-check digits (8 vs 3, 1 vs 7).</p>`],
      ["📈 Forecasting & scenarios",`<p>"Build a 12-month cash forecast template with base, best and worst case, assumptions in one tab." AI is great at structure and at stress-testing your assumptions: <em>"What assumptions here are most fragile?"</em></p>`],
      ["✅ Accuracy checks",`<p>Use AI as a second reviewer: <em>"Here's my workbook logic. Where could errors hide? Check for hardcoded numbers, broken ranges, and inconsistent formulas."</em></p>`]
    ]},
    {t:"h", h:"The anonymize-first workflow"},
    {t:"p", h:`<div class="flow"><div class="st"><b>1 · Copy</b>Duplicate the file. Never work on the original.</div><div class="ar" aria-hidden="true">→</div><div class="st"><b>2 · Scrub</b>Names → "Client A", account #s → "ACCT-01", remove SSNs/addresses.</div><div class="ar" aria-hidden="true">→</div><div class="st"><b>3 · Ask</b>Get the formula, method or analysis from AI.</div><div class="ar" aria-hidden="true">→</div><div class="st"><b>4 · Apply</b>Run the method on the real file yourself, inside your secure system.</div></div>
    <p>The trick: AI rarely needs the real data. It needs the <em>shape</em> of the data. Build the template or formula on fake rows, then apply it to the real ones.</p>`},
    {t:"cmp", title:"Reconciliation prompt", bad:"reconcile these", good:`Context: Two anonymized files attached: bank_export.csv (date, description, amount) and ledger_export.csv (date, memo, debit, credit). Same account, March.
Role: Act as a meticulous staff accountant.
Ask: Match transactions on amount, and on date within ±3 days. Then list (1) unmatched bank items, (2) unmatched ledger items, (3) possible duplicates, (4) the totals of each file and the difference.
Format: Tables for each list. Show your matching rules. Do not guess on ambiguous matches; flag them for me.`, why:"Clear rules, clear outputs, and an instruction not to guess. That's how you get something auditable instead of something that just looks right."},
    {t:"h", h:"Best tools for Cole"},
    {t:"p", h:`<div class="grid g2">
      <div class="card"><span class="cat-tag">Analysis & writing</span><h3>Claude Pro</h3><p class="small">Long documents, careful reasoning, Excel add-in included. Runs real calculations on uploaded files.</p></div>
      <div class="card"><span class="cat-tag">Inside Office</span><h3>Copilot / M365 Premium</h3><p class="small">If you live in Excel and Outlook personally. At work, use your company's license.</p></div>
      <div class="card"><span class="cat-tag">Inside Sheets</span><h3>Gemini</h3><p class="small">=AI() function, Fill with Gemini, formula help in the side panel.</p></div>
      <div class="card"><span class="cat-tag">Research</span><h3>Perplexity</h3><p class="small">Sourced answers on accounting standards and tax questions, to verify at the primary source.</p></div>
    </div>`},
    {t:"h", h:"A day in the life, with AI"},
    {t:"tl", items:[
      ["8:00am · inbox","Asks Copilot/Claude to summarize a 30-email thread about a disputed invoice: \"What's agreed, what's open, who owes what?\""],
      ["9:30am · month-end","Anonymized bank vs. ledger exports go into Claude. 6 exceptions come back. Cole checks each one himself and finds the real issue in 20 minutes instead of 2 hours."],
      ["11:00am · formula","\"Why is this SUMIFS returning 0?\" Turns out it's text-formatted dates. 30 seconds."],
      ["1:30pm · PDFs","Extracts 40 line items from vendor PDF invoices into a table; ties the totals out before using it."],
      ["3:00pm · commentary","Drafts variance commentary from the summary table, then rewrites the key lines in his own words."],
      ["4:30pm · forecast","\"Stress-test my assumptions. Which ones would hurt most if they're wrong?\" Adds a downside scenario."]
    ]},
    {t:"h", h:"Your prompts"},
    {t:"comp", name:"library:cole"},
    {t:"check", items:[
      ["co-1","Ask AI to explain the most complicated formula in a workbook you use."],
      ["co-2","Build a reconciliation using fake/anonymized data and the prompt above."],
      ["co-3","Extract a table from a PDF invoice or statement and tie out the total."],
      ["co-4","Find out what AI tool (if any) your employer has approved."],
      ["co-5","Have AI stress-test the assumptions in a forecast or budget."]
    ]}
  ],
  quiz:[
    {q:"What's the right division of labor between Cole and AI on financial work?", a:2, o:[
      ["AI does it; Cole skims.","Skimming is how errors ship."],
      ["Cole does everything; AI is too risky.","Leaves hours of savings on the table."],
      ["AI drafts, structures and flags; Cole verifies, ties out and signs off.","Exactly. Speed with control."],
      ["Whoever's faster does it.","Accountability doesn't work that way."]]},
    {q:"Cole needs a reconciliation method but the file has client names and account numbers. Best path?", a:0, o:[
      ["Build and test the method on an anonymized copy, then apply it to the real file in his secure system.","Correct. AI needs the shape, not the secrets."],
      ["Upload the real file to his personal AI account just this once.","\"Just once\" is how policy violations start."],
      ["Email the file to himself and then upload it.","Same problem with extra steps."],
      ["Give up on AI for recs.","No need. Anonymize first."]]},
    {q:"AI extracted line items from a scanned PDF invoice. What's the must-do check?", a:3, o:[
      ["Make sure the table looks neat.","Neat isn't accurate."],
      ["Ask the AI if it's accurate.","It'll probably say yes."],
      ["Nothing. Extraction is always exact.","Scans especially can misread digits."],
      ["Tie the extracted total to the document total and spot-check digits.","Yes. Tie-out is non-negotiable."]]},
    {q:"Which feature lets Google Sheets users categorize or summarize text across many rows from inside a cell?", a:1, o:[
      ["VLOOKUP","Classic lookup, no AI."],
      ["The =AI() function / Fill with Gemini","Right."],
      ["Pivot tables","Useful, but not AI text processing."],
      ["Conditional formatting","Not this."]]},
    {q:"Best prompt instruction to avoid AI \"guessing\" on ambiguous reconciliation matches?", a:2, o:[
      ["\"Be accurate.\"","Too vague to change behavior."],
      ["\"Hurry up.\"","Opposite of helpful."],
      ["\"Do not guess on ambiguous matches; flag them for me with the reason.\"","Yes. Explicit rules make output auditable."],
      ["\"Pretend you're an auditor.\"","Role helps, but the explicit rule matters most."]]},
    {q:"Where does Claude's Excel add-in come from?", a:0, o:[
      ["It's included with Claude Pro and higher plans.","Correct (generally available since May 2026)."],
      ["It's a free Microsoft feature.","That's Copilot's territory, not Claude's."],
      ["You need to write code to use it.","No coding needed."],
      ["It only works in Google Sheets.","It's an Excel add-in."]]}
  ]

cody:{
  id:"cody", who:"Cody", title:"Cody's Track: Sell More, Build a Brand, Build Income", sub:"Prospecting, call prep, content, automation, and realistic AI-powered side income", mins:60,
  sections:[
    {t:"p", h:`<p class="lede">You sell to contractors, you're building a roofing business, and you want income that doesn't need you in the room. AI touches all three. Let's go.</p>`},
    {t:"h", h:"Part 1: Sales, the AI-assisted way"},
    {t:"ex", items:[
      ["🎯 Prospecting",`<p>Use Research mode or Perplexity to build lists: <em>"Roofing companies in [city] with under 50 Google reviews."</em> Then for each prospect, have AI scan their website and reviews for gaps: no recent job photos, slow review replies, no service-area pages, no ads. That gap becomes your opener.</p>`],
      ["📋 Call prep (5-minute brief)",`<p>Paste their website, Google reviews and Facebook page into Claude: <em>"Give me a one-page call brief: what they do, how they talk about themselves, 3 likely pain points, 3 questions to ask, and one specific compliment I can genuinely give."</em></p>`],
      ["🎤 Scripts & objection practice",`<p>Voice mode role-play: <em>"You're a skeptical roofing owner who got burned by a marketing agency before. I'm calling you cold. Push back hard. After 5 minutes, grade me."</em> Do this in the truck between appointments.</p>`],
      ["📬 Follow-up",`<p>After a call, dictate a messy recap into your phone. Ask AI for (1) a CRM note, (2) a follow-up email recapping their pain points in their words, and (3) a 3-touch follow-up sequence over 10 days.</p>`]
    ]},
    {t:"h", h:"Part 2: Content & your personal brand"},
    {t:"p", h:`<p>Contractors trust people who sound like them. Your edge is that you know both worlds: trades and marketing. AI helps you show up consistently without it eating your week.</p>`},
    {t:"flip", cards:[
      ["The content engine","Record one 10-minute talking-head video a week (phone is fine). AI turns the transcript into: 5 short clips ideas, 3 LinkedIn posts, a Facebook post, an email, and 10 hooks."],
      ["Hooks","\"Give me 20 hooks for a post about why roofers lose jobs to the slower, more expensive guy.\" Pick 3. Test them."],
      ["Visuals","Canva AI for graphics, ChatGPT or Gemini for images, Gemini (Veo) / Runway / Kling for short video clips. Claude writes the words."],
      ["Voice","Keep a Claude Project called \"Cody Brand\" with your voice notes, best posts, and the words you never use. Every draft comes out sounding like you."],
      ["Consistency","Batch content Sunday night: 1 hour with AI = a week of posts. Schedule with a free scheduler or Meta's built-in tools."],
      ["Proof","Before/after case studies from clients (with permission) beat every clever post. AI drafts them from your notes."]
    ]},
    {t:"h", h:"Part 3: Running the roofing business"},
    {t:"p", h:`<ul>
      <li><strong>Speed-to-lead:</strong> form fill → instant personal text → you call. (See Module 5.)</li>
      <li><strong>Estimate follow-ups:</strong> AI drafts a day-2, day-5, day-10 sequence that's helpful, not pushy.</li>
      <li><strong>Review requests:</strong> automated text after job completion, with a direct link.</li>
      <li><strong>Job photo captions:</strong> snap 4 photos, AI writes the post and Google Business Profile update.</li>
      <li><strong>Storm season:</strong> pre-written, honest content ready to go. Never fear-mongering.</li>
      <li><strong>Estimates:</strong> AI can help structure a proposal template. <em>Pricing and measurements stay yours.</em></li>
    </ul>`},
    {t:"h", h:"Part 4: Realistic AI-powered income"},
    {t:"call", k:"warn", title:"Straight talk on \"passive\" income", h:`<p>Almost nothing is truly passive at the start. Expect 3–12 months of real work before anything pays reliably. Anyone selling "make $10K/month with AI on autopilot" is selling you the course, not the income. The real edge AI gives you: you can build and test things <strong>10x faster and cheaper</strong> than before.</p>`},
    {t:"fork", id:"cody-income", q:"Pick an income model to explore", opts:[
      ["Digital products","Templates, packs, guides",`<h4>Idea: The Contractor Follow-Up Kit</h4><p>A $29–$49 pack: 30 text/email templates for estimates, follow-ups, review requests and slow-season outreach, written for roofers and other trades. AI drafts it; your trade knowledge makes it good.</p><p><strong>First 30 days:</strong> (1) Ask 5 contractors what messages they hate writing. (2) Build v1 with AI in a weekend. (3) Sell it through a simple checkout page. (4) Give it free to 3 contractors for testimonials. (5) Post about it in your content.</p><p class="muted small">Why it fits: low cost, you already have the audience, and it feeds your agency pipeline.</p>`],
      ["Niche service","Automation-as-a-service",`<h4>Idea: Speed-to-Lead & Reviews setup for contractors</h4><p>Set up (with Zapier or Make plus their existing tools) instant lead text-back, review requests and missed-call text-back. Charge a setup fee plus a small monthly fee for maintenance.</p><p><strong>First 30 days:</strong> (1) Build it for your own roofing business first. (2) Document results. (3) Offer it to 3 existing agency clients at a pilot price. (4) Turn the setup into a repeatable checklist (AI writes the SOP).</p><p class="muted small">Most realistic of the bunch: real problem, recurring revenue, matches your skills. Not passive, but very leveraged.</p>`],
      ["Content & audience","YouTube, newsletter, socials",`<h4>Idea: "Marketing for Roofers, from a guy who's in it"</h4><p>Weekly video + newsletter. Money comes later from sponsors, affiliate links to tools you actually use, and your own products and services.</p><p><strong>First 30 days:</strong> (1) Pick one platform. (2) Publish 8 pieces with the AI content engine. (3) Start an email list from day one. (4) Track which topics get contractor DMs.</p><p class="muted small">Slowest to pay but compounds: it makes every other model easier to sell.</p>`]
    ]},
    {t:"h", h:"Best tools for Cody"},
    {t:"p", h:`<div class="grid g2">
      <div class="card"><span class="cat-tag">Brain & writing</span><h3>Claude Pro</h3><p class="small">Call briefs, scripts, content in your voice (Projects), research, Cowork scheduled lead summaries, Claude in Chrome for prospect research.</p></div>
      <div class="card"><span class="cat-tag">Visuals & video</span><h3>Gemini AI Pro / Canva</h3><p class="small">Veo video clips and images (Gemini AI Pro, $19.99), Canva for branded graphics.</p></div>
      <div class="card"><span class="cat-tag">Automation</span><h3>Zapier or Make</h3><p class="small">Speed-to-lead, review requests. Start on free tiers.</p></div>
      <div class="card"><span class="cat-tag">Calls</span><h3>Fathom (Free)</h3><p class="small">Records and summarizes video sales calls with unlimited recordings on the free plan. Always tell people you're recording.</p></div>
    </div>`},
    {t:"h", h:"A day in the life, with AI"},
    {t:"tl", items:[
      ["6:30am · already done","A Cowork scheduled task has his call list ready: new leads + stale quotes, ranked, with openers."],
      ["7:15am · truck","Voice mode role-play: practices the \"we already have a marketing guy\" objection three ways."],
      ["9:00am · prospecting","Claude in Chrome reviews 5 prospects' websites and Google profiles, then builds a gap table."],
      ["11:30am · after a call","Dictates a messy recap; gets a CRM note + recap email + follow-up sequence."],
      ["2:00pm · roofing biz","Snaps job photos; AI writes the Facebook post and GBP update."],
      ["8:30pm · side income","45 min building v1 of the Contractor Follow-Up Kit with Claude."]
    ]},
    {t:"h", h:"Your prompts"},
    {t:"comp", name:"library:cody"},
    {t:"check", items:[
      ["cd-1","Create a \"Cody Brand\" Project with your voice, offers and 5 of your best posts."],
      ["cd-2","Run a 5-minute AI call brief on a real prospect before calling."],
      ["cd-3","Do one voice-mode objection role-play."],
      ["cd-4","Turn one video or voice memo into a week of posts."],
      ["cd-5","Pick one income model and write its 30-day first steps."]
    ]}
  ],
  quiz:[
    {q:"What's the best use of AI in cold prospecting?", a:1, o:[
      ["Blast the same AI email to 1,000 contractors.","Generic volume burns your reputation and domain."],
      ["Research each prospect's real gaps (reviews, photos, ads) and use one specific gap as the opener.","Yes. Specific beats spammy."],
      ["Let AI call prospects for you.","Not the move for relationship sales with contractors."],
      ["Skip research; just pitch hard.","Contractors can smell a generic pitch."]]},
    {q:"How should Cody keep AI content sounding like him?", a:3, o:[
      ["Write \"sound like Cody\" in every prompt.","AI doesn't know what that means without examples."],
      ["Use the same prompt for every platform.","Platforms need different formats."],
      ["Accept the first draft.","First drafts are generic."],
      ["Keep a Project with his voice notes, best posts and banned words so every draft starts from his style.","Right. Examples beat adjectives."]]},
    {q:"What's the honest take on AI \"passive income\"?", a:0, o:[
      ["It usually takes months of real work first; AI makes building and testing much faster.","Correct."],
      ["It's instant and fully automatic.","That's the pitch of people selling courses."],
      ["It's impossible.","Plenty of people build real income. It just isn't magic."],
      ["Only coders can do it.","Most models here need zero code."]]},
    {q:"Which income model most directly uses Cody's existing skills for recurring revenue?", a:2, o:[
      ["Selling AI art prints","Possible, but unrelated to his edge."],
      ["Crypto trading bots","Risky, unrelated, and not advice we'd give."],
      ["Automation-as-a-service for contractors (speed-to-lead, review requests)","Yes. Real problem, his audience, recurring fees."],
      ["Writing a novel with AI","Fun, not a fit for his goals."]]},
    {q:"Cody records sales calls with an AI notetaker. What's the must-do?", a:1, o:[
      ["Hide it so the prospect acts natural.","Many states require consent, and trust matters more."],
      ["Tell people the call is being recorded and summarized.","Correct. Disclose, every time."],
      ["Only record calls that go badly.","Record consistently (with consent) to learn from all of them."],
      ["Share the full recording with other prospects.","Absolutely not."]]},
    {q:"For roofing estimates, where should AI stop?", a:3, o:[
      ["It shouldn't touch estimates at all.","It's great for templates and follow-ups."],
      ["AI should set the final price.","Pricing needs your measurements, costs and judgment."],
      ["AI should measure the roof from memory.","No."],
      ["It can structure the proposal and follow-ups; measurements and pricing stay Cody's.","Right."]]}
  ]
}

   1E. GLOSSARY  (tap/hover definitions)
   --------------------------------------------------------------------- */
const GLOSSARY = {
  "ai":["AI (artificial intelligence)","Software that does things we used to think needed a human brain: writing, understanding images, holding a conversation."],
  "llm":["Large language model (LLM)","The engine behind chatbots like Claude and ChatGPT. Trained on huge amounts of text to predict what words come next."],
  "prompt":["Prompt","What you type or say to the AI. Your instructions."],
  "model":["Model","A specific version of an AI \"brain,\" like Sonnet 5.5 or Gemini 3.1 Pro. Newer and bigger usually means smarter."],
  "hallucination":["Hallucination","When AI confidently states something false or made-up."],
  "training cutoff":["Training cutoff","The date an AI's built-in knowledge ends. It only knows newer stuff if it searches the web."],
  "context window":["Context window","How much text the AI can keep in mind at once in a conversation, including files you upload."],
  "token":["Token","A chunk of text (about ¾ of a word). Usage limits and API prices are counted in tokens."],
  "agent":["Agent","AI that takes multiple steps on its own to reach a goal: browsing, clicking, reading files, then reporting back."],
  "connector":["Connector","A permissioned link that lets an AI read (and sometimes act in) another app like Gmail or Google Drive."],
  "mcp":["MCP (Model Context Protocol)","The open standard Claude's connectors are built on. Think of it as a universal plug for AI tools."],
  "project":["Project","In Claude or ChatGPT: a workspace with saved files and instructions that every chat inside it can use."],
  "artifact":["Artifact","Something Claude builds in a side panel (a document, chart, or small app) that you can edit and share."],
  "deep research":["Deep research / Research mode","A mode where the AI runs many searches, reads results, and writes a cited report. Takes minutes, not seconds."],
  "multimodal":["Multimodal","Able to work with more than text: images, audio, PDFs, video."],
  "automation":["Automation","A set of steps that runs by itself when something happens (a trigger)."],
  "trigger":["Trigger","The event that kicks off an automation: a new email, a form submission, a time of day."],
  "action":["Action","What an automation does: send a text, add a row, create a task."],
  "api":["API","A way for software to talk to other software. Automation tools use APIs behind the scenes so you don't have to."],
  "voice mode":["Voice mode","Talking out loud with the AI and hearing it answer back, like a phone call."],
  "anonymize":["Anonymize","Replacing names, account numbers and other identifying details with placeholders before sharing data."],
  "reconciliation":["Reconciliation","Matching two sets of records (like bank vs. books) to make sure they agree, and explaining the differences."],
  "speed-to-lead":["Speed-to-lead","How fast you respond to a new inquiry. Faster usually wins the job."],
  "skills":["Skills (Claude)","Saved, reusable instructions and scripts that teach Claude to do a task your way, every time."],
  "cowork":["Cowork (Claude)","A workspace in the Claude desktop app where Claude works with your files and connected apps, including scheduled tasks."]
};

const STORE_KEY = "gbp:v1", THEME_KEY = "gbp:theme";
let storageOK = true;
function sGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ storageOK=false; return null; } }
function sSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ storageOK=false; return false; } }
(function probe(){ try{ const t="gbp:probe"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); }catch(e){ storageOK=false; } })();

function newProfile(){
  return {xp:0, aw:{}, quiz:{}, done:{}, checks:{}, forks:{}, assess:{}, badges:{}, copied:0, picks:0, roi:null, autos:{}, viewed:{}, plan:null, focus:null};
}
function normalizeProfile(p){
  const base = newProfile(); if(!p || typeof p!=="object") return base;
  for(const k in base){ if(p[k]===undefined || p[k]===null && base[k]!==null) p[k]=base[k]; }
  if(typeof p.xp!=="number" || !isFinite(p.xp)) p.xp=0;
  return p;
}
function loadDB(){
  const raw = sGet(STORE_KEY);
  if(raw){ try{ const d=JSON.parse(raw); if(d && typeof d==="object" && d.profiles){ for(const id in d.profiles) d.profiles[id]=normalizeProfile(d.profiles[id]); return d; } }catch(e){} }
  return {active:null, profiles:{}};
}
let DB = loadDB();
function save(){ sSet(STORE_KEY, JSON.stringify(DB)); }
function activeId(){ return DB.active && PEOPLE[DB.active] ? DB.active : "guest"; }
function P(){ const id=activeId(); if(!DB.profiles[id]) DB.profiles[id]=newProfile(); return DB.profiles[id]; }
function ownTrack(){ return PEOPLE[activeId()].track; }

/* ---------- XP, levels, badges ---------- */
function levelOf(xp){
  let i=0; LEVELS.forEach((l,j)=>{ if(xp>=l[0]) i=j; });
  const cur=LEVELS[i], nxt=LEVELS[i+1];
  return {i, name:cur[1], floor:cur[0], next:nxt?nxt[0]:null, pct: nxt ? Math.min(1,(xp-cur[0])/(nxt[0]-cur[0])) : 1};
}
function award(key, amt, label){
  const p=P(); if(p.aw[key]) return false;
  const before=levelOf(p.xp).i;
  p.aw[key]=amt; p.xp+=amt; save();
  toast("+"+amt+" XP", label||"");
  const after=levelOf(p.xp);
  if(after.i>before) toast("LEVEL UP", "You're now a "+after.name, "badge");
  checkBadges(); updateChrome();
  return true;
}
function giveBadge(id){
  const p=P(); if(p.badges[id]) return;
  const b=BADGES.find(x=>x.id===id); if(!b) return;
  p.badges[id]=Date.now(); save();
  toast(b.ic, "Badge earned: "+b.n, "badge");
  award("badge:"+id, 20, "Badge bonus");
}
function trackDone(p,t){ return !!p.done["t:"+t]; }
function checkBadges(){
  const p=P(), own=ownTrack();
  const quizKeys=Object.keys(p.quiz);
  if(Object.keys(p.assess).length>=ASSESS.length) giveBadge("duty");
  if(quizKeys.length>=1) giveBadge("first");
  if(quizKeys.some(k=>p.quiz[k].best===p.quiz[k].total)) giveBadge("ace");
  if(Object.keys(p.forks).length>=3) giveBadge("fork");
  if(Object.values(p.checks).filter(Boolean).length>=5) giveBadge("hands");
  if(p.copied>=5) giveBadge("prompt");
  if(p.picks>=3) giveBadge("scout");
  if(p.roi && p.roi.ran) giveBadge("roi");
  if(Object.keys(p.viewed).some(t=>t!==own)) giveBadge("spy");
  if(CORE.every(m=>p.done["m:"+m.id])) giveBadge("core");
  if(own ? trackDone(p,own) : ["kyle","cole","cody"].some(t=>trackDone(p,t))) giveBadge("track");
  if(p.plan) giveBadge("plan");
  if(levelOf(p.xp).i===LEVELS.length-1) giveBadge("legend");
}
function courseProgress(p){
  const own=ownTrack();
  let total=CORE.length+2, done=0;
  CORE.forEach(m=>{ if(p.done["m:"+m.id]) done++; });
  if(own ? trackDone(p,own) : ["kyle","cole","cody"].some(t=>trackDone(p,t))) done++;
  if(p.plan) done++;
  return {done,total,pct:Math.round(done/total*100)};
}

/* ---------- toasts ---------- */
function toast(big, text, kind){
  const box=$("#toasts"); if(!box) return;
  const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:"");
  t.innerHTML=`<span class="tx">${esc(big)}</span><span>${esc(text)}</span>`;
  box.appendChild(t);
  while(box.children.length>3) box.removeChild(box.firstChild);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),320); }, 2600);
}

/* ---------- clipboard (with a fallback for older Safari / file://) ---------- */
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0"; ta.style.fontSize="16px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ ta.setSelectionRange(0,text.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); return ok;
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function copyWithToast(text, okMsg){
  return copyText(text).then(ok=>{
    toast(ok?"✓":"!", ok?(okMsg||"Copied to clipboard"):"Couldn't copy. Press and hold the text to copy it instead");
    return ok;
  });
}

    switch(s.t){
      case "p": return `<div class="sec">${gl(s.h)}</div>`;

      case "ex": return `<div class="sec">`+s.items.map((it,j)=>`<details class="ex"><summary>${it[0]}</summary><div class="ex-b">${gl(it[1])}</div></details>`).join("")+`</div>`;
      case "check": return checklistHTML(s.items);
      case "fork": return forkHTML(s);
      case "cmp": return `<h3>${esc(s.title)}</h3><div class="cmp"><div class="bad"><h4>✘ Before</h4><pre>${esc(s.bad)}</pre></div><div class="good"><h4>✔ After</h4><pre>${esc(s.good)}</pre><div class="row" style="margin-top:8px"><button class="btn sm ghost" data-copytext="${esc(s.good)}">Copy</button></div></div><p class="cmp-why"><strong>Why it works:</strong> ${s.why}</p></div>`;
      case "call": return `<div class="callout ${s.k||""}"><span class="ct">${s.title}</span>${gl(s.h)}</div>`;

const QA = {}; // in-memory answers for the current attempt
function quizHTML(key, quiz, title){
  const p=P(), rec=p.quiz[key];
  QA[key]={};
  return `<section class="quiz" data-quiz="${key}" aria-labelledby="qh-${key}"><div class="eyebrow">Check yourself</div><h2 id="qh-${key}">${esc(title)} Quiz</h2>
    <p class="muted small">${quiz.length} questions · +10 XP per first correct answer · +50 XP for finishing${rec?` · <strong>Your best: ${rec.best}/${rec.total}</strong>`:""}</p>`+
    quiz.map((q,qi)=>`<div class="qq" data-qq="${qi}"><div class="qt">${qi+1}. ${esc(q.q)}</div>`+
      q.o.map((o,oi)=>`<button type="button" class="opt" data-q="${key}" data-qi="${qi}" data-oi="${oi}"><span class="ol">${"ABCD"[oi]}</span><span>${esc(o[0])}</span></button>`).join("")+
      `<div class="fbwrap" aria-live="polite"></div></div>`).join("")+
    `<div class="qscore"></div></section>`;
}
function answerQuiz(key, qi, oi){
  const quiz = quizFor(key); if(!quiz) return;
  if(QA[key] && QA[key][qi]!=null) return;
  QA[key]=QA[key]||{}; QA[key][qi]=oi;
  const q=quiz[qi], box=$(`[data-quiz="${key}"] [data-qq="${qi}"]`);
  $$(".opt",box).forEach(b=>{ const i=+b.dataset.oi; b.disabled=true; if(i===q.a) b.classList.add("right"); else if(i===oi) b.classList.add("wrong"); });
  const right = oi===q.a;
  $(".fbwrap",box).innerHTML = right
    ? `<div class="fb ok"><b>✔ Correct</b>${esc(q.o[oi][1])}</div>`
    : `<div class="fb no"><b>✘ Not quite</b>${esc(q.o[oi][1])}<br><br><strong>Answer: ${"ABCD"[q.a]}, "${esc(q.o[q.a][0])}"</strong><br>${esc(q.o[q.a][1].replace(/^(Correct|Right|Yes|Exactly)\b[.!:]?\s*/i,""))}</div>`;
  if(right) award("q:"+key+":"+qi, 10, "Correct answer");
  if(Object.keys(QA[key]).length===quiz.length) finishQuiz(key, quiz);
}
function finishQuiz(key, quiz){
  const p=P();
  const score = quiz.reduce((n,q,i)=>n+(QA[key][i]===q.a?1:0),0);
  const prev=p.quiz[key];
  p.quiz[key]={best:Math.max(score, prev?prev.best:0), total:quiz.length, last:score, attempts:(prev?prev.attempts:0)+1};
  p.done[key]=true; save();
  const [kind,id]=key.split(":");
  const name = kind==="m" ? CORE.find(m=>m.id===id).title : TRACKS[id].who+"'s track";
  award("done:"+key, 50, name+" complete");
  checkBadges(); updateChrome();
  const pct=Math.round(score/quiz.length*100);
  const msg = pct===100?"Perfect game. 🔥": pct>=80?"Strong. You've got this.": pct>=60?"Solid. Review the misses above.":"Worth a second pass. Re-read the section, then retake.";
  const nxt = nextAfter(kind==="m"?"#/m/"+id:"#/t/"+id);
  $(`[data-quiz="${key}"] .qscore`).innerHTML = `<div class="score"><span class="big">${score}/${quiz.length}</span><span>${msg}</span><span class="spacer"></span><button class="btn sm ghost" data-retake="${key}">Retake</button>${nxt?`<a class="btn sm primary" href="${nxt.href}">Next: ${esc(nxt.label)} →</a>`:""}</div>`;
}
function quizFor(key){ const [k,id]=key.split(":"); if(k==="m"){ const m=CORE.find(x=>x.id===id); return m&&m.quiz; } return TRACKS[id]&&TRACKS[id].quiz; }

function nextAfter(href){ const o=order(); const i=o.findIndex(x=>x.href===href); return i>=0&&i<o.length-1?o[i+1]:null; }
function prevBefore(href){ const o=order(); const i=o.findIndex(x=>x.href===href); return i>0?o[i-1]:null; }
function continueTarget(){
  const p=P(), own=ownTrack();
  if(Object.keys(p.assess).length<ASSESS.length) return {href:"#/welcome",label:"Start with the self-check"};

}
function nextPrevHTML(href){

/* ---------- Capstone: 30-day plan (rule-based) ---------- */
function stackFor(track, budget, eco){
  const s=[]; const add=(n,why,price)=>s.push([n,why,price]);
  const b=+budget||0;
  const second = eco==="google"?["Gemini Free","Second opinion + images, native to your Google apps","$0"]:eco==="ms"?["Microsoft Copilot (free app)","Second opinion; plays nice with Microsoft","$0"]:["ChatGPT Free","Second opinion + image generation","$0"];
  if(b>=20) add("Claude Pro","Main assistant: Research, Cowork scheduled tasks, Claude in Chrome, Excel add-in","$20"); else add("Claude Free","Main assistant: writing, docs, Projects, memory","$0");
  if(b>=50){
    if(track==="cody") add("Google AI Pro","Veo video + images for content, 5 TB storage","$19.99");
    else if(track==="cole") add(eco==="google"?"Google AI Pro":"Microsoft 365 Premium", eco==="google"?"Gemini in Sheets & Gmail":"Copilot inside Excel & Outlook (personal use)","$19.99");
    else if(track==="kyle") add("Perplexity Pro","Deeper career & industry research with sources","$20");
    else add("ChatGPT Plus","Images, agent mode, second opinion","$20");
  } else s.push(second);
  if(!(b>=50 && track==="kyle")) add("Perplexity Free","Quick sourced answers","$0");
  if(track==="kyle"||track==="cole") add("NotebookLM","Study and learn from your own documents","$0");
  if(track==="cody"){ add("Canva Free","Branded graphics for posts","$0"); add("Fathom Free","Record + summarize video sales calls (with consent)","$0"); }
  if(b>=100){
    if(track==="cody"){ add("Make Core","Speed-to-lead and review automations","$16"); add("Granola","Bot-free meeting notes","$18"); }
    else if(track==="cole"){ add("Perplexity Pro","Sourced research on standards and rules","$20"); add("Granola","Meeting notes without a bot","$18"); }
    else if(track==="kyle"){ add("ChatGPT Plus","Second opinion, images, agent mode","$20"); add("Otter Pro","Transcribe trainings and meetings","$16.99"); }
    else { add("Zapier Pro (yearly)","Real automations","$19.99"); }
  } else add(track==="cody"?"Zapier or Make Free":"Zapier Free","Your first small automation","$0");
  const total=s.reduce((n,x)=>n+(parseFloat(String(x[2]).replace(/[^0-9.]/g,""))||0),0);
  return {items:s, total};
}
function buildPlan(track){
  const p=P(), a=p.assess, hrs=+a.hours||3, n=hrs>=5?4:hrs>=3?3:2;
  const weeks=[[],[],[],[]];
  // Track pools
  if(track==="kyle"){
    const path=p.forks["kyle-path"]; const parts=PLAN_POOL.kyle.parts, car=PLAN_POOL.kyle.career;
    for(let w=0;w<4;w++){
      let pool = path===0?parts[w].concat(car[w]) : path===1?car[w].concat(parts[w]) : interleave(parts[w],car[w]);
      if(a.goal==="career" && path==null) pool=car[w].concat(parts[w]);
      weeks[w]=pool.slice();
    }
  } else if(track==="cody"){
    const inc=["digital","service","content"][p.forks["cody-income"]!=null?p.forks["cody-income"]:1];
    for(let w=0;w<4;w++){ weeks[w]=PLAN_POOL.cody.base[w].slice(); weeks[w].splice(w>=2?1:2,0,"Side income ("+({digital:"digital product",service:"automation service",content:"content & audience"})[inc]+"): "+PLAN_POOL.cody[inc][w][0]); }
  } else if(track==="cole"){
    for(let w=0;w<4;w++) weeks[w]=PLAN_POOL.cole.base[w].slice();
    const shop=p.forks["cole-shop"];
    weeks[0].splice(1,0, shop===1?"Turn on Gemini in Sheets (if your plan allows) and try the =AI() function on a sample column.":"Install the Claude for Excel add-in (Pro) or open Copilot in Excel, and ask it to explain a sheet.");
  } else {
    for(let w=0;w<4;w++) weeks[w]=PLAN_POOL.general.base[w].slice();
  }
  // Personalization layers
  const st=stackFor(track,a.budget,a.eco);
  weeks[0].unshift("Set up your stack: "+st.items.map(x=>x[0]).join(", ")+".");
  if(a.use==="never"||a.use==="month"||+a.conf<=2) weeks[0].splice(1,0,"Use the CRAFT play once a day. Keep the Prompt Builder open until it's automatic.");
  if(a.worry==="privacy") weeks[0].splice(1,0,"Find the privacy/data setting in your AI app and decide on purpose. Review the traffic light in Module 6.");
  if(a.worry==="accuracy") weeks[1].unshift("Run the \"Find your own mistakes\" prompt on every important answer this week.");
  if(a.worry==="cost") weeks[3].unshift("Do the 30-day test: cancel any AI subscription you didn't use 3+ times last week.");
  const weak=Object.entries(p.quiz).filter(([k,v])=>k.startsWith("m:")&&v.best/v.total<0.8).map(([k])=>CORE.find(m=>"m:"+m.id===k)).filter(Boolean);
  if(weak.length) weeks[1].unshift("Review Module "+weak[0].n+" ("+weak[0].title+") and retake its quiz. Aim for 80%+.");
  const missing=CORE.filter(m=>!p.done["m:"+m.id]);
  if(missing.length) weeks[0].splice(1,0,"Finish the core modules you skipped: "+missing.map(m=>m.title).join(", ")+".");
  if(p.roi && p.roi.rows && p.roi.rows.length){
    const top=p.roi.rows.slice().sort((x,y)=>(y[1]*y[2])-(x[1]*x[2]))[0];
    if(top && top[0]) weeks[1].splice(1,0,"Point most of your AI time at \""+top[0]+"\". That's your biggest payoff per the ROI calculator.");
  }
  const starred=AUTOS.filter(x=>p.autos[x.id]);
  if(starred[0]) weeks[2].splice(1,0,"Set up automation: "+starred[0].n+" ("+starred[0].tool+").");
  if(starred[1]) weeks[3].splice(1,0,"Set up automation: "+starred[1].n+" ("+starred[1].tool+").");
  const limit=n+1; // personalization pushes a bit beyond base cap
  const out=weeks.map((w,i)=>dedupe(w).slice(0,i===0?limit+1:limit));
  return {weeks:out, stack:st, track, hrs, made:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
}
function interleave(a,b){ const r=[]; for(let i=0;i<Math.max(a.length,b.length);i++){ if(a[i]) r.push(a[i]); if(b[i]) r.push(b[i]); } return r; }
function dedupe(a){ return a.filter((x,i)=>a.indexOf(x)===i); }
function planText(plan){
  const who=PEOPLE[activeId()].name;
  let t=`${who.toUpperCase()}'S 30-DAY AI GAME PLAN\n(Gray Brothers Playbook · ${plan.made})\n`;
  plan.weeks.forEach((w,i)=>{ t+=`\n${WEEK_NAMES[i].toUpperCase()}\n`+w.map((x,j)=>`${j+1}. ${x}`).join("\n")+"\n"; });
  t+=`\nMY TOOL STACK (≈ $${Math.round(plan.stack.total)}/mo)\n`+plan.stack.items.map(x=>`• ${x[0]} (${x[2]}): ${x[1]}`).join("\n");
  t+=`\n\nRule: AI drafts, I decide. Verify anything that matters.`;
  return t;
}
function viewPlan(){
  const p=P(), own=ownTrack(), a=p.assess, hasA=Object.keys(a).length>=ASSESS.length;
  const focus = own || p.focus || "kyle";
  const plan = p.plan;
  return `<div class="view-enter"><div class="mod-head"><div class="eyebrow">Capstone · 15 min</div><h1>Your 30-Day Game Plan</h1><p class="lede" style="margin:0">Built from your self-check, quiz scores, path choices, starred automations and ROI numbers. No AI calls, just rules written for you.</p></div>
  ${hasA?"":`<div class="banner">You haven't done the self-check yet, so the plan will use defaults. <a href="#/welcome">Take it (1 min) →</a></div>`}
  ${own?"":`<div class="card"><label class="f" for="planfocus">Plan focus</label><select class="inp" id="planfocus">${[["kyle","Kyle's track: parts + career"],["cole","Cole's track: finance"],["cody","Cody's track: sales + income"],["general","General: everyday life"]].map(o=>`<option value="${o[0]}" ${focus===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`}
  <div class="card"><h3 style="margin-top:0">What we're working with</h3><div class="row">${hasA?ASSESS.map(q=>{ const o=q.o.find(x=>x[0]===a[q.id]); return o?`<span class="pill">${esc(o[1])}</span>`:""; }).join(""):`<span class="muted">Defaults</span>`}<span class="pill">⭐ ${Object.values(p.autos).filter(Boolean).length} automations starred</span><span class="pill">${Object.keys(p.quiz).length} quizzes done</span></div>
  <button type="button" class="btn primary block" id="planGo" style="margin-top:14px">${plan?"Rebuild my plan":"Generate my plan"} →</button></div>
  <div id="planOut">${plan?planHTML(plan):""}</div></div>`;
}
function planHTML(plan){
  return `<h2>The plan</h2>`+plan.weeks.map((w,i)=>`<div class="plan-week"><h3>${WEEK_NAMES[i]}</h3><ol>${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`).join("")+
  `<h2>Your starter stack</h2><div class="card">${plan.stack.items.map(x=>`<div class="stack-line"><div><strong>${esc(x[0])}</strong><div class="small muted">${esc(x[1])}</div></div><span class="pr">${esc(x[2])}</span></div>`).join("")}<div class="stack-line"><strong>Total</strong><span class="pr" style="color:var(--accent)">≈ $${Math.round(plan.stack.total)}/mo</span></div></div>
  <div class="row" style="margin-top:16px"><button type="button" class="btn primary" id="planCopy">📋 Copy to clipboard</button><span class="muted small">Then paste it into a text to yourself, or into Notes.</span></div>
  <div class="callout win"><span class="ct">Final whistle</span>You made it. Text your plan to yourself, then text your brothers your level. Friendly competition is allowed.</div>`;
}

/* ---------- Progress / backup ---------- */
function b64e(s){ const bytes=new TextEncoder().encode(s); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); }
function b64d(s){ const bin=atob(s); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(bytes); }
function exportCode(){ return "GBP1:"+b64e(JSON.stringify({v:1, id:activeId(), at:Date.now(), p:P()})); }
function viewProgress(){
  const p=P(), lv=levelOf(p.xp), cp=courseProgress(p), pe=PEOPLE[activeId()];
  return `<div class="view-enter"><div class="mod-head"><div class="eyebrow">My Progress</div><h1>${esc(pe.name)}: ${lv.name}</h1><p class="lede" style="margin:0">${p.xp} XP · ${cp.pct}% through the course · ${Object.keys(p.badges).length}/${BADGES.length} badges</p></div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${cp.pct}" aria-label="Course progress"><i style="width:${cp.pct}%"></i></div>
  <h2>Badges</h2>${badgesHTML(p)}
  <h2>Move progress between devices</h2>
  <div class="card"><h3 style="margin-top:0">1 · Export from this device</h3><p class="small">Copy this code and text or email it to yourself.</p><label class="sr-only" for="expcode">Your export code</label><textarea class="inp" id="expcode" readonly rows="4">${esc(exportCode())}</textarea><button type="button" class="btn" id="expCopy" style="margin-top:10px">Copy my code</button></div>
  <div class="card"><h3 style="margin-top:0">2 · Import on the other device</h3><p class="small">Paste the code here. It replaces this device's progress for that person.</p><label class="sr-only" for="impcode">Paste an export code</label><textarea class="inp" id="impcode" rows="4" placeholder="GBP1:…"></textarea><div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="impGo">Import progress</button><span class="small" id="impMsg" aria-live="polite"></span></div></div>
  <h2>Reset</h2><div class="card"><p class="small">Start ${esc(pe.name)}'s progress over on this device. Other profiles aren't touched.</p><button type="button" class="btn ghost" id="resetMe">Reset ${esc(pe.name)}'s progress</button></div>
  ${storageOK?"":`<div class="banner" style="margin-top:14px">Storage is blocked in this browser. Export before you close the page.</div>`}</div>`;
}
function doImport(){
  const raw=($("#impcode").value||"").replace(/\s+/g,""); const msg=$("#impMsg");
  try{
    if(!raw.startsWith("GBP1:")) throw new Error("That doesn't look like a Playbook code (it should start with GBP1:).");
    const d=JSON.parse(b64d(raw.slice(5)));
    if(!d || !PEOPLE[d.id] || !d.p || typeof d.p.xp!=="number") throw new Error("The code is damaged or incomplete. Try copying it again.");
    if(!confirm(`Import ${PEOPLE[d.id].name}'s progress (${d.p.xp} XP)? This replaces ${PEOPLE[d.id].name}'s progress on this device.`)) return;
    DB.profiles[d.id]=normalizeProfile(d.p); DB.active=d.id; save();
    toast("✓", "Progress imported for "+PEOPLE[d.id].name);
    updateChrome(); render();
  }catch(e){ msg.textContent = e.message && e.message.length<140 ? e.message : "Couldn't read that code. Make sure you copied the whole thing."; msg.style.color="var(--red)"; }
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function render(){
  const h=(location.hash||"").replace(/^#\/?/,""); const [a,b]=h.split("/");
  let html;
  if(!DB.active && a!=="start" && a!=="progress") { html=viewStart(); }
  else switch(a){
    case "": case "home": html=viewHome(); break;
    case "start": html=viewStart(); break;
    case "welcome": html=viewWelcome(); break;
    case "m": html=viewModule(b); break;
    case "t": html=viewTrack(b); break;
    case "library": html=viewLibrary(); break;
    case "picker": html=viewPicker(); break;
    case "roi": html=viewROI(); break;
    case "glossary": html=viewGlossary(); break;
    case "plan": html=viewPlan(); break;
    case "progress": html=viewProgress(); break;
    default: html=view404();
  }
  MAIN.innerHTML = html + footerHTML();
  mountComps(MAIN);
  if(a==="welcome") runTerminal();
  if(a==="roi") drawROI();
  updateChrome(); hideGloss(); openDrawer(false);
  window.scrollTo(0,0);
  try{ MAIN.focus({preventScroll:true}); }catch(e){}
  const h1=$("h1",MAIN); document.title = (h1 && a ? h1.textContent.trim()+" · " : "")+"The Gray Brothers Playbook";
}
function footerHTML(){
  return `<footer class="foot"><p><strong>The Gray Brothers Playbook</strong> · Built with Claude Code for Kyle, Cole &amp; Cody.</p><p>Accurate as of <strong>${AS_OF}</strong>. AI tools change monthly. Check a company's pricing page before you buy. Brand names are used for identification only; this course isn't affiliated with or endorsed by any of them.</p></footer>`;
}

/* =====================================================================
   EVENTS (one delegated listener for everything)
   ===================================================================== */
document.addEventListener("click", e=>{
  const t=e.target;
  if(t.closest("#menuBtn")){ openDrawer(!document.body.classList.contains("drawer-open")); return; }
  if(t.closest("#drawerBg")){ openDrawer(false); return; }
  if(t.closest("#themeBtn")){ const cur=document.documentElement.getAttribute("data-theme"); sSet(THEME_KEY, cur==="dark"?"light":"dark"); applyTheme(); return; }

  const gb=t.closest(".gl"); if(gb){ e.preventDefault(); showGloss(gb, true); return; }
  if(!t.closest("#glossPop")) hideGloss();

  const pf=t.closest("[data-profile]"); if(pf){
    DB.active=pf.dataset.profile; if(!DB.profiles[DB.active]) DB.profiles[DB.active]=newProfile(); save();
    LIB._init=false;
    const p=P(); location.hash = Object.keys(p.assess).length>=ASSESS.length ? "#/home" : "#/welcome"; return;
  }
  const fl=t.closest("[data-flip]"); if(fl){ const on=!fl.classList.contains("on"); fl.classList.toggle("on",on); fl.setAttribute("aria-pressed",on); return; }
  const ck=t.closest("[data-chk]"); if(ck){
    const p=P(), id=ck.dataset.chk, on=!p.checks[id]; p.checks[id]=on; save(); ck.setAttribute("aria-pressed",on);
    if(on) award("chk:"+id,15,"Tried it"); checkBadges(); return;
  }
  const fk=t.closest("[data-fork]"); if(fk){
    const s=FORKS[fk.dataset.fork], i=+fk.dataset.i, p=P(); p.forks[s.id]=i; save();
    const box=fk.closest("[data-forkbox]"); $$(".fork-opt",box).forEach(b=>b.setAttribute("aria-pressed", +b.dataset.i===i));
    $(".fork-out",box).innerHTML=gl(s.opts[i][2]);
    award("fork:"+s.id,10,"Chose a path"); checkBadges(); return;
  }
  const qb=t.closest("[data-q]"); if(qb){ answerQuiz(qb.dataset.q, +qb.dataset.qi, +qb.dataset.oi); return; }
  const rt=t.closest("[data-retake]"); if(rt){ const key=rt.dataset.retake, sec=rt.closest("[data-quiz]"); const [k,id]=key.split(":"); const src=k==="m"?CORE.find(m=>m.id===id):TRACKS[id]; sec.outerHTML=quizHTML(key, src.quiz, k==="m"?src.title:src.who+"'s Track"); const ns=$(`[data-quiz="${key}"]`); if(ns) ns.scrollIntoView({behavior:reduceMotion?"auto":"smooth"}); return; }
  const cp=t.closest("[data-copyprompt]"); if(cp){ const x=PROMPTS[+cp.dataset.copyprompt]; copyWithToast(x.p,"Prompt copied").then(()=>{ const p=P(); p.copied++; save(); award("copy:"+cp.dataset.copyprompt,5,"Prompt copied"); checkBadges(); }); return; }
  const ct=t.closest("[data-copytext]"); if(ct){ copyWithToast(ct.dataset.copytext,"Prompt copied"); return; }

  const ls=t.closest("[data-ls]"); if(ls){ const k=ls.dataset.ls; if(k==="free") LS.free=!LS.free; else LS[k]=ls.dataset.v; const el=ls.closest("[data-comp]"); compLandscape(el); const f=$(`[data-ls="${k}"]${k==="free"?"":`[data-v="${ls.dataset.v}"]`}`,el); if(f) f.focus(); return; }
  const lb=t.closest("[data-lib]"); if(lb){ LIB.t=lb.dataset.lib; const el=lb.closest("[data-comp]"); compLibrary(el); const f=$(`[data-lib="${LIB.t}"]`,el); if(f) f.focus(); return; }
  const ab=t.closest("[data-ab]"); if(ab){ AB_ALL=ab.dataset.ab==="all"; compAutobrain(ab.closest("[data-comp]")); return; }
  const sr=t.closest("[data-star]"); if(sr){ const p=P(), id=sr.dataset.star; p.autos[id]=!p.autos[id]; save(); if(p.autos[id]) award("star:first",10,"Starred an automation idea"); const el=sr.closest("[data-comp]"); compAutobrain(el); const f=$(`[data-star="${id}"]`,el); if(f) f.focus(); return; }
  const sk=t.closest("[data-stack]"); if(sk){ STACK_TAB=sk.dataset.stack; const el=sk.closest("[data-comp]"); compStacks(el); const f=$(`[data-stack="${STACK_TAB}"]`,el); if(f) f.focus(); return; }

  const as=t.closest("[data-assess]"); if(as){ const p=P(); p.assess[as.dataset.assess]=as.dataset.v; save(); $$(`[data-assess="${as.dataset.assess}"]`).forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===as.dataset.v)); return; }
  if(t.closest("#assessDone")){
    const p=P(), left=ASSESS.filter(q=>!p.assess[q.id]);
    if(left.length){ $("#assessMsg").textContent="Answer the last "+left.length+" question"+(left.length>1?"s":"")+" first: \""+left[0].q+"\""; return; }
    award("assess",25,"Self-check done"); checkBadges(); location.hash="#/home"; return;
  }

  const pk=t.closest("[data-pick]"); if(pk){ showPick([pk.dataset.pick]); return; }
  const pa=t.closest("[data-pkall]"); if(pa){ PK_ALL=pa.dataset.pkall==="1"; render(); return; }
  if(t.closest("#pkgo")){ const q=$("#pkq").value.trim(); if(!q){ $("#pkq").focus(); return; } showPick(matchPicks(q), q); return; }

  if(t.closest("#roi-add")){ const r=roiState(); r.rows.push(["New task",2,30]); save(); $("#roi-rows").innerHTML=r.rows.map((x,i)=>roiRowHTML(x,i)).join(""); drawROI(); return; }
  if(t.closest("#roi-reset")){ const p=P(); const ran=p.roi&&p.roi.ran; p.roi=null; const r=roiState(); r.ran=!!ran; save(); render(); return; }
  const rd=t.closest("[data-rdel]"); if(rd){ const r=roiState(); r.rows.splice(+rd.dataset.rdel,1); save(); $("#roi-rows").innerHTML=r.rows.map((x,i)=>roiRowHTML(x,i)).join(""); drawROI(); return; }
  if(t.closest("#roi-run")){ const r=roiState(); r.ran=true; save(); drawROI(); award("roi",30,"Crunched your ROI"); checkBadges(); $("#roi-out").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}); return; }

  if(t.closest("#planGo")){
    const p=P(); const own=ownTrack(); const sel=$("#planfocus"); if(sel){ p.focus=sel.value; }
    const plan=buildPlan(own || (sel?sel.value:"general")); p.plan=plan; save();
    $("#planOut").innerHTML=planHTML(plan); award("plan",75,"Game plan built"); checkBadges(); updateChrome();
    $("#planOut").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}); return;
  }
  if(t.closest("#planCopy")){ const p=P(); if(p.plan) copyWithToast(planText(p.plan),"Plan copied. Text it to yourself!"); return; }
  if(t.closest("#expCopy")){ copyWithToast($("#expcode").value,"Code copied"); return; }
  if(t.closest("#impGo")){ doImport(); return; }
  if(t.closest("#resetMe")){ const id=activeId(); if(confirm("Reset all of "+PEOPLE[id].name+"'s progress on this device? This can't be undone.")){ DB.profiles[id]=newProfile(); save(); toast("↺","Progress reset"); render(); } return; }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="lsq"){ LS.q=t.value; drawLandscape(t.closest("[data-comp]")); }
  if(t.id==="libq"){ LIB.q=t.value; drawLibrary(t.closest("[data-comp]")); }
  if(t.id==="glq"){ const q=t.value.toLowerCase().trim(); $$("[data-gt]").forEach(c=>c.style.display=!q||c.dataset.gt.includes(q)?"":"none"); }
  if(t.id==="roi-rate"){ const r=roiState(); r.rate=t.value; save(); drawROI(); }
  if(t.dataset && t.dataset.rf!=null){ const r=roiState(), i=+t.closest("[data-row]").dataset.row, f=+t.dataset.rf; r.rows[i][f]= f===0?t.value:(+t.value||0); save(); drawROI(); }
});
document.addEventListener("change", e=>{ if(e.target.dataset && e.target.dataset.rf==="2"){ const r=roiState(), i=+e.target.closest("[data-row]").dataset.row; r.rows[i][2]=+e.target.value; save(); drawROI(); } });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ hideGloss(); openDrawer(false); }
  if(e.key==="Enter" && e.target.id==="pkq"){ e.preventDefault(); $("#pkgo").click(); }
  // arrow keys for tabs
  const tab=e.target.closest && e.target.closest("[data-stack]");
  if(tab && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ const keys=Object.keys(STACKS); let i=keys.indexOf(tab.dataset.stack)+(e.key==="ArrowRight"?1:-1); i=(i+keys.length)%keys.length; STACK_TAB=keys[i]; const el=tab.closest("[data-comp]"); compStacks(el); $(`[data-stack="${STACK_TAB}"]`,el).focus(); }
});
window.addEventListener("hashchange", render);

/* ---------- glossary popover ---------- */
let glossFor=null;
function showGloss(btn){
  const g=GLOSSARY[btn.dataset.gl]; if(!g) return;
  const pop=$("#glossPop");
  if(glossFor===btn && pop.classList.contains("on")){ hideGloss(); return; }
  pop.innerHTML=`<b>${esc(g[0])}</b>${esc(g[1])}`; pop.classList.add("on"); glossFor=btn;
  const r=btn.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=window.scrollX+r.left+r.width/2-pw/2; left=Math.max(window.scrollX+12, Math.min(left, window.scrollX+document.documentElement.clientWidth-pw-12));
  let top=window.scrollY+r.bottom+8; if(r.bottom+ph+16>window.innerHeight && r.top>ph+16) top=window.scrollY+r.top-ph-8;
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
function hideGloss(){ const pop=$("#glossPop"); if(pop) pop.classList.remove("on"); glossFor=null; }
document.addEventListener("mouseover", e=>{ const g=e.target.closest && e.target.closest(".gl"); if(g && window.matchMedia && window.matchMedia("(hover:hover)").matches && glossFor!==g) showGloss(g); });
document.addEventListener("focusin", e=>{ const g=e.target.closest && e.target.closest(".gl"); if(g && glossFor!==g) showGloss(g); });
window.addEventListener("resize", hideGloss);
